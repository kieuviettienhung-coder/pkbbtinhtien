                    <div className="space-y-3">
                        {medicines.length === 0 && (
                            <p className="text-gray-400 text-center py-4">Chưa có thuốc nào</p>
                        )}
                        {medicines.map((medicine, index) => {
                            const suggestions = showSuggestions[index] ? getSuggestions(index, medicine.name) : [];
                            const total = (parseFloat(medicine.quantity || 0) * parseFloat(medicine.price || 0));
                            
                            return (
                                <div key={index} className="bg-gray-50 p-3 rounded-lg border border-gray-200">
                                    {/* Tên thuốc - Hiển thị riêng trên mobile */}
                                    <div className="mb-2 relative">
                                        <input
                                            type="text"
                                            value={medicine.name}
                                            onChange={(e) => {
                                                updateMedicine(index, 'name', e.target.value);
                                                setShowSuggestions({ ...showSuggestions, [index]: true });
                                            }}
                                            onFocus={() => setShowSuggestions({ ...showSuggestions, [index]: true })}
                                            onBlur={() => setTimeout(() => setShowSuggestions({ ...showSuggestions, [index]: false }), 200)}
                                            placeholder="Tên thuốc..."
                                            disabled={readOnly}
                                            className={`w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 capitalize font-medium ${readOnly ? 'bg-gray-100 cursor-not-allowed' : ''}`}
                                        />
                                        {suggestions.length > 0 && !readOnly && (
                                            <div className="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-48 overflow-y-auto">
                                                {suggestions.map((suggestion, i) => (
                                                    <div
                                                        key={i}
                                                        onClick={() => selectMedicine(index, suggestion)}
                                                        className="px-4 py-2 hover:bg-purple-50 cursor-pointer"
                                                    >
                                                        <div className="font-semibold capitalize text-sm">{suggestion.name}</div>
                                                        <div className="text-xs text-green-600 font-bold">{suggestion.price}k</div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    
                                    {/* Số lượng, Giá, Tổng tiền - Hiển thị trên 1 hàng */}
                                    <div className="flex gap-2 items-center">
                                        <div className="flex-1">
                                            <label className="text-xs text-gray-600 block mb-1">Số lượng</label>
                                            <input
                                                type="number"
                                                value={medicine.quantity}
                                                onChange={(e) => updateMedicine(index, 'quantity', e.target.value)}
                                                placeholder="SL"
                                                disabled={readOnly}
                                                className={`w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-center ${readOnly ? 'bg-gray-100 cursor-not-allowed' : ''}`}
                                            />
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-xs text-gray-600 block mb-1">Giá (k)</label>
                                            <input
                                                type="number"
                                                value={medicine.price}
                                                onChange={(e) => updateMedicine(index, 'price', e.target.value)}
                                                placeholder="Giá"
                                                disabled={readOnly}
                                                className={`w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 ${readOnly ? 'bg-gray-100 cursor-not-allowed' : ''}`}
                                            />
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-xs text-gray-600 block mb-1">Tổng</label>
                                            <div className="w-full px-3 py-2 bg-purple-50 border border-purple-200 rounded-lg text-center font-semibold text-purple-700">
                                                {total.toLocaleString()}k
                                            </div>
                                        </div>
                                        {!readOnly && (
                                            <div className="flex-shrink-0">
                                                <label className="text-xs text-transparent block mb-1">X</label>
                                                <button
                                                    onClick={() => removeMedicine(index)}
                                                    className="bg-red-500 text-white px-3 py-2 rounded-lg hover:bg-red-600 transition font-bold"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                        {medicines.length > 0 && (
                            <div className="mt-4 p-4 bg-purple-50 rounded-lg border-2 border-purple-300">
                                <p className="text-lg font-bold text-purple-800">
                                    Tổng tiền thuốc: {totalMedicine.toLocaleString()}k
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Report View Component
        function ReportView({ selectedBranch, selectedDate, monthlyData, ngaBayMonthlyData = {} }) {
            const getTransferredMedicineForDay = (dateKey) => {
                if (selectedBranch !== 'thot-not') return 0;
                const nbDay = ngaBayMonthlyData[dateKey];
                if (!nbDay || !Array.isArray(nbDay.medicines)) return 0;
                return nbDay.medicines.reduce((sum, med) => sum + (parseFloat(med.quantity || 0) * parseFloat(med.price || 0)), 0);
            };

            const calculateDayTotals = (dayData, dateKey) => {
                const examTotal = Object.entries(dayData.examinations || {})
                    .filter(([price, count]) => count && parseFloat(count) > 0)
                    .reduce((sum, [price, count]) => {
                        return sum + (parseFloat(price) * parseFloat(count));
                    }, 0);

                const expenseTotal = (dayData.expenses || []).reduce((sum, exp) => {
                    return sum + parseFloat(exp.amount || 0);
                }, 0);

                const doctorTotal = (dayData.doctorFees || []).reduce((sum, fee) => {
                    return sum + parseFloat(fee.amount || 0);
                }, 0);

                const medicineTotal = (dayData.medicines || []).reduce((sum, med) => {
                    return sum + (parseFloat(med.quantity || 0) * parseFloat(med.price || 0));
                }, 0);

                const transferredMedicine = getTransferredMedicineForDay(dateKey);
                const netTotal = (examTotal - expenseTotal - doctorTotal - medicineTotal) + transferredMedicine;

                return {
                    examTotal,
                    expenseTotal,
                    doctorTotal,
                    medicineTotal,
                    transferredMedicine,
                    netTotal
                };
            };

            const monthlyTotals = Object.entries(monthlyData).reduce((acc, [dateKey, day]) => {
                const totals = calculateDayTotals(day, dateKey);
                return {
                    examTotal: acc.examTotal + totals.examTotal,
                    expenseTotal: acc.expenseTotal + totals.expenseTotal,
                    doctorTotal: acc.doctorTotal + totals.doctorTotal,
                    medicineTotal: acc.medicineTotal + totals.medicineTotal,
                    transferredMedicine: acc.transferredMedicine + totals.transferredMedicine,
                    netTotal: acc.netTotal + totals.netTotal
                };
            }, { examTotal: 0, expenseTotal: 0, doctorTotal: 0, medicineTotal: 0, transferredMedicine: 0, netTotal: 0 });

            const sortedDays = Object.entries(monthlyData).sort((a, b) => a[0].localeCompare(b[0]));

            const exportToExcel = () => {
                const wb = XLSX.utils.book_new();
                const isThotNot = selectedBranch === 'thot-not';
                
                // Sheet 1: Tổng hợp
                const summaryHeaders = isThotNot
                    ? ['Ngày', 'Tiền khám (k)', 'Số ca', 'Số ca 0đ', 'Lương BS (k)', 'Chi phí (k)', 'Tiền thuốc (k)', 'Thuốc nhận từ NB (k)', 'Còn lại (k)']
                    : ['Ngày', 'Tiền khám (k)', 'Số ca', 'Số ca 0đ', 'Lương BS (k)', 'Chi phí (k)', 'Tiền thuốc chuyển TN (k)', 'Còn lại (k)'];

                const summaryData = [
                    ['PHÒNG KHÁM BÁCH BẢO'],
                    [`Báo cáo tháng ${selectedDate.substring(5, 7)}/${selectedDate.substring(0, 4)}`],
                    [`Chi nhánh: ${isThotNot ? 'Thốt Nốt' : 'Ngã Bảy'}`],
                    [],
                    summaryHeaders,
                ];

                sortedDays.forEach(([dateKey, dayData]) => {
                    const totals = calculateDayTotals(dayData, dateKey);
                    const totalCases = Object.entries(dayData.examinations || {}).reduce((sum, [price, count]) => {
                        return sum + parseInt(count || 0);
                    }, 0);
                    
                    // Đếm số ca 0 đồng
                    const zeroCases = parseInt(dayData.examinations?.['0'] || 0);
                    
                    const row = isThotNot
                        ? [dayData.date, totals.examTotal, totalCases, zeroCases, totals.doctorTotal, totals.expenseTotal, totals.medicineTotal, totals.transferredMedicine, totals.netTotal]
                        : [dayData.date, totals.examTotal, totalCases, zeroCases, totals.doctorTotal, totals.expenseTotal, totals.medicineTotal, totals.netTotal];
                    summaryData.push(row);
                });

                summaryData.push([]);
                
                const totalCasesMonth = sortedDays.reduce((sum, [dateKey, dayData]) => {
                    return sum + Object.entries(dayData.examinations || {}).reduce((s, [price, count]) => {
                        return s + parseInt(count || 0);
                    }, 0);
                }, 0);
                
                // Tổng số ca 0 đồng cả tháng
                const totalZeroCasesMonth = sortedDays.reduce((sum, [dateKey, dayData]) => {
                    return sum + parseInt(dayData.examinations?.['0'] || 0);
                }, 0);
                
                const totalRow = isThotNot
                    ? ['TỔNG', monthlyTotals.examTotal, totalCasesMonth, totalZeroCasesMonth, monthlyTotals.doctorTotal, monthlyTotals.expenseTotal, monthlyTotals.medicineTotal, monthlyTotals.transferredMedicine, monthlyTotals.netTotal]
                    : ['TỔNG', monthlyTotals.examTotal, totalCasesMonth, totalZeroCasesMonth, monthlyTotals.doctorTotal, monthlyTotals.expenseTotal, monthlyTotals.medicineTotal, monthlyTotals.netTotal];
                summaryData.push(totalRow);

                const wsSummary = XLSX.utils.aoa_to_sheet(summaryData);
                wsSummary['!cols'] = isThotNot ? [
                    { wch: 12 },  // Ngày
                    { wch: 15 },  // Tiền khám
                    { wch: 10 },  // Số ca
                    { wch: 10 },  // Số ca 0đ
                    { wch: 15 },  // Lương BS
                    { wch: 15 },  // Chi phí
                    { wch: 15 },  // Tiền thuốc
                    { wch: 22 },  // Thuốc từ NB
                    { wch: 15 }   // Còn lại
                ] : [
                    { wch: 12 },  // Ngày
                    { wch: 15 },  // Tiền khám
                    { wch: 10 },  // Số ca
                    { wch: 10 },  // Số ca 0đ
                    { wch: 15 },  // Lương BS
                    { wch: 15 },  // Chi phí
                    { wch: 22 },  // Tiền thuốc chuyển TN
                    { wch: 15 }   // Còn lại
                ];
                XLSX.utils.book_append_sheet(wb, wsSummary, 'Tổng hợp');

                // Sheet 2: Chi tiết tiền thuốc
                const medicineData = [
                    ['PHÒNG KHÁM BÁCH BẢO'],
                    [`Chi tiết tiền thuốc tháng ${selectedDate.substring(5, 7)}/${selectedDate.substring(0, 4)}`],
                    [`Chi nhánh: ${isThotNot ? 'Thốt Nốt' : 'Ngã Bảy'}`],
                    [],
                    ['Ngày', 'Tên thuốc', 'Số lượng', 'Giá (k)', 'Thành tiền (k)'],
                ];

                sortedDays.forEach(([dateKey, dayData]) => {
                    if (dayData.medicines && dayData.medicines.length > 0) {
                        dayData.medicines.forEach((med, index) => {
                            const total = parseFloat(med.quantity || 0) * parseFloat(med.price || 0);
                            medicineData.push([
                                index === 0 ? dayData.date : '',
                                med.name,
                                med.quantity,
                                med.price,
                                total
                            ]);
                        });
                        // Tổng ngày
                        const dayMedicineTotal = dayData.medicines.reduce((sum, med) => {
                            return sum + (parseFloat(med.quantity || 0) * parseFloat(med.price || 0));
                        }, 0);
                        medicineData.push([
                            '',
                            `Tổng ${dayData.date}`,
                            '',
                            '',
                            dayMedicineTotal
                        ]);
                        medicineData.push([]);
                    }
                });

                medicineData.push([]);
                medicineData.push(['', 'TỔNG TIỀN THUỐC THÁNG', '', '', monthlyTotals.medicineTotal]);

                const wsMedicine = XLSX.utils.aoa_to_sheet(medicineData);
                wsMedicine['!cols'] = [
                    { wch: 12 },
                    { wch: 30 },
                    { wch: 12 },
                    { wch: 12 },
                    { wch: 15 }
                ];
                XLSX.utils.book_append_sheet(wb, wsMedicine, 'Chi tiết thuốc');

                // Sheet 3: Chi tiết tiền khám
                const examData = [
                    ['PHÒNG KHÁM BÁCH BẢO'],
                    [`Chi tiết tiền khám tháng ${selectedDate.substring(5, 7)}/${selectedDate.substring(0, 4)}`],
                    [`Chi nhánh: ${isThotNot ? 'Thốt Nốt' : 'Ngã Bảy'}`],
                    [],
                    ['Ngày', 'Giá khám (k)', 'Số ca', 'Thành tiền (k)'],
                ];

                sortedDays.forEach(([dateKey, dayData]) => {
                    if (dayData.examinations && Object.keys(dayData.examinations).length > 0) {
                        const sortedExams = Object.entries(dayData.examinations)
                            .filter(([price, count]) => count && count > 0)
                            .sort((a, b) => parseFloat(a[0]) - parseFloat(b[0]));
                        
                        sortedExams.forEach(([price, count], index) => {
                            const total = parseFloat(price) * parseFloat(count);
                            examData.push([
                                index === 0 ? dayData.date : '',
                                price,
                                count,
                                total
                            ]);
                        });
                        
                        const dayExamTotal = Object.entries(dayData.examinations).reduce((sum, [price, count]) => {
                            return sum + (parseFloat(price) * parseFloat(count || 0));
                        }, 0);
                        const dayTotalCases = Object.entries(dayData.examinations).reduce((sum, [price, count]) => {
                            return sum + parseInt(count || 0);
                        }, 0);
                        
                        examData.push([
                            '',
                            `Tổng ${dayData.date}`,
                            dayTotalCases,
                            dayExamTotal
                        ]);
                        examData.push([]);
                    }
                });

                examData.push([]);
                examData.push(['', 'TỔNG THÁNG', totalCasesMonth, monthlyTotals.examTotal]);

                const wsExam = XLSX.utils.aoa_to_sheet(examData);
                wsExam['!cols'] = [
                    { wch: 12 },
                    { wch: 15 },
                    { wch: 12 },
                    { wch: 15 }
                ];
                XLSX.utils.book_append_sheet(wb, wsExam, 'Chi tiết khám');

                // Sheet 4: Chi tiết lương bác sĩ
                const doctorData = [
                    ['PHÒNG KHÁM BÁCH BẢO'],
                    [`Chi tiết lương bác sĩ tháng ${selectedDate.substring(5, 7)}/${selectedDate.substring(0, 4)}`],
                    [`Chi nhánh: ${isThotNot ? 'Thốt Nốt' : 'Ngã Bảy'}`],
                    [],
                    ['Ngày', 'Tên bác sĩ', 'Lương (k)'],
                ];

                sortedDays.forEach(([dateKey, dayData]) => {
                    if (dayData.doctorFees && dayData.doctorFees.length > 0) {
                        dayData.doctorFees.forEach((doc, index) => {
                            doctorData.push([
                                index === 0 ? dayData.date : '',
                                doc.doctor,
                                doc.amount
                            ]);
                        });
                        const dayDoctorTotal = dayData.doctorFees.reduce((sum, doc) => {
                            return sum + parseFloat(doc.amount || 0);
                        }, 0);
                        doctorData.push([
                            '',
                            `Tổng ${dayData.date}`,
                            dayDoctorTotal
                        ]);
                        doctorData.push([]);
                    }
                });

                doctorData.push([]);
                doctorData.push(['', 'TỔNG LƯƠNG THÁNG', monthlyTotals.doctorTotal]);

                const wsDoctor = XLSX.utils.aoa_to_sheet(doctorData);
                wsDoctor['!cols'] = [
                    { wch: 12 },
                    { wch: 25 },
                    { wch: 15 }
                ];
                XLSX.utils.book_append_sheet(wb, wsDoctor, 'Chi tiết lương BS');

                // Sheet 5: Chi tiết chi phí
                const expenseData = [
                    ['PHÒNG KHÁM BÁCH BẢO'],
                    [`Chi tiết chi phí tháng ${selectedDate.substring(5, 7)}/${selectedDate.substring(0, 4)}`],
                    [`Chi nhánh: ${isThotNot ? 'Thốt Nốt' : 'Ngã Bảy'}`],
                    [],
                    ['Ngày', 'Mô tả', 'Số tiền (k)'],
                ];

                sortedDays.forEach(([dateKey, dayData]) => {
                    if (dayData.expenses && dayData.expenses.length > 0) {
                        dayData.expenses.forEach((exp, index) => {
                            expenseData.push([
                                index === 0 ? dayData.date : '',
                                exp.description,
                                exp.amount
                            ]);
                        });
                        const dayExpenseTotal = dayData.expenses.reduce((sum, exp) => {
                            return sum + parseFloat(exp.amount || 0);
                        }, 0);
                        expenseData.push([
                            '',
                            `Tổng ${dayData.date}`,
                            dayExpenseTotal
                        ]);
                        expenseData.push([]);
                    }
                });

                expenseData.push([]);
                expenseData.push(['', 'TỔNG CHI PHÍ THÁNG', monthlyTotals.expenseTotal]);

                const wsExpense = XLSX.utils.aoa_to_sheet(expenseData);
                wsExpense['!cols'] = [
                    { wch: 12 },
                    { wch: 35 },
                    { wch: 15 }
                ];
                XLSX.utils.book_append_sheet(wb, wsExpense, 'Chi tiết chi phí');
                
                const filename = `BaoCao_${selectedBranch}_${selectedDate.substring(0, 7)}.xlsx`;
                XLSX.writeFile(wb, filename);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-lg shadow-md p-6">
                        <div className="flex justify-between items-center mb-4">
                            <div>
                                <h2 className="text-2xl font-bold text-gray-800">
                                    📊 Báo cáo tháng {selectedDate.substring(5, 7)}/{selectedDate.substring(0, 4)}
                                </h2>
                                <h3 className="text-lg text-gray-600 mt-1">
                                    Chi nhánh: {selectedBranch === 'nga-bay' ? '🏥 Ngã Bảy' : '🏥 Thốt Nốt'}
                                </h3>
                            </div>
                            <button
                                onClick={exportToExcel}
                                className="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition font-bold shadow-lg flex items-center gap-2"
                            >
                                📥 Xuất Excel
                            </button>
                        </div>

                        {/* Monthly Summary */}
                        <div className={`grid grid-cols-1 md:grid-cols-2 ${selectedBranch === 'thot-not' ? 'lg:grid-cols-6' : 'lg:grid-cols-5'} gap-4 mb-6`}>
                            <div className="bg-gradient-to-br from-green-50 to-green-100 p-6 rounded-lg border-l-4 border-green-500 shadow">
                                <p className="text-sm text-green-700 font-semibold mb-1">💰 Tổng tiền khám</p>
                                <p className="text-3xl font-bold text-green-600">{monthlyTotals.examTotal.toLocaleString()}k</p>
                            </div>
                            <div className="bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-lg border-l-4 border-blue-500 shadow">
                                <p className="text-sm text-blue-700 font-semibold mb-1">👨‍⚕️ Lương bác sĩ</p>
                                <p className="text-3xl font-bold text-blue-600">{monthlyTotals.doctorTotal.toLocaleString()}k</p>
                            </div>
                            <div className="bg-gradient-to-br from-orange-50 to-orange-100 p-6 rounded-lg border-l-4 border-orange-500 shadow">
                                <p className="text-sm text-orange-700 font-semibold mb-1">💸 Chi phí</p>
                                <p className="text-3xl font-bold text-orange-600">{monthlyTotals.expenseTotal.toLocaleString()}k</p>
                            </div>
                            <div className="bg-gradient-to-br from-purple-50 to-purple-100 p-6 rounded-lg border-l-4 border-purple-500 shadow">
                                <p className="text-sm text-purple-700 font-semibold mb-1">💊 Tiền thuốc{selectedBranch === 'nga-bay' ? ' (chuyển TN)' : ''}</p>
                                <p className="text-3xl font-bold text-purple-600">{monthlyTotals.medicineTotal.toLocaleString()}k</p>
                            </div>
                            {selectedBranch === 'thot-not' && (
                                <div className="bg-gradient-to-br from-teal-50 to-teal-100 p-6 rounded-lg border-l-4 border-teal-500 shadow">
                                    <p className="text-sm text-teal-700 font-semibold mb-1">📦 Thuốc từ Ngã Bảy</p>
                                    <p className="text-3xl font-bold text-teal-600">+{monthlyTotals.transferredMedicine.toLocaleString()}k</p>
                                </div>
                            )}
                            <div className={`p-6 rounded-lg border-l-4 shadow ${monthlyTotals.netTotal >= 0 ? 'bg-gradient-to-br from-emerald-50 to-emerald-100 border-emerald-500' : 'bg-gradient-to-br from-red-50 to-red-100 border-red-500'}`}>
                                <p className={`text-sm font-semibold mb-1 ${monthlyTotals.netTotal >= 0 ? 'text-emerald-700' : 'text-red-700'}`}>💵 Còn lại</p>
                                <p className={`text-3xl font-bold ${monthlyTotals.netTotal >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                                    {monthlyTotals.netTotal.toLocaleString()}k
                                </p>
                            </div>
                        </div>

                        {/* Daily Details Table */}
                        <div className="overflow-x-auto">
                            <table className="w-full border-collapse">
                                <thead>
                                    <tr className="bg-gradient-to-r from-gray-700 to-gray-800 text-white">
                                        <th className="border border-gray-600 p-3 text-left">📅 Ngày</th>
                                        <th className="border border-gray-600 p-3 text-right">💰 Tiền khám</th>
                                        <th className="border border-gray-600 p-3 text-right">👨‍⚕️ Lương BS</th>
                                        <th className="border border-gray-600 p-3 text-right">💸 Chi phí</th>
                                        <th className="border border-gray-600 p-3 text-right">💊 Tiền thuốc{selectedBranch === 'nga-bay' ? ' (chuyển TN)' : ''}</th>
                                        {selectedBranch === 'thot-not' && (
                                            <th className="border border-gray-600 p-3 text-right">📦 Thuốc nhận từ NB</th>
                                        )}
                                        <th className="border border-gray-600 p-3 text-right">💵 Còn lại</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {sortedDays.length === 0 && (
                                        <tr>
                                            <td colSpan={selectedBranch === 'thot-not' ? 7 : 6} className="border p-6 text-center text-gray-400">
                                                Chưa có dữ liệu trong tháng này
                                            </td>
                                        </tr>
                                    )}
                                    {sortedDays.map(([dateKey, dayData]) => {
                                        const totals = calculateDayTotals(dayData, dateKey);
                                        return (
                                            <tr key={dateKey} className="hover:bg-blue-50 transition">
                                                <td className="border border-gray-300 p-3 font-semibold">{dayData.date}</td>
                                                <td className="border border-gray-300 p-3 text-right text-green-600 font-bold">
                                                    {totals.examTotal.toLocaleString()}k
                                                </td>
                                                <td className="border border-gray-300 p-3 text-right text-blue-600 font-semibold">
                                                    {totals.doctorTotal.toLocaleString()}k
                                                </td>
                                                <td className="border border-gray-300 p-3 text-right text-orange-600 font-semibold">
                                                    {totals.expenseTotal.toLocaleString()}k
                                                </td>
                                                <td className="border border-gray-300 p-3 text-right text-purple-600 font-semibold">
                                                    {totals.medicineTotal.toLocaleString()}k
                                                </td>
                                                {selectedBranch === 'thot-not' && (
                                                    <td className="border border-gray-300 p-3 text-right text-teal-600 font-semibold">
                                                        +{totals.transferredMedicine.toLocaleString()}k
                                                    </td>
                                                )}
                                                <td className={`border border-gray-300 p-3 text-right font-bold ${totals.netTotal >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                                                    {totals.netTotal.toLocaleString()}k
                                                </td>
                                            </tr>
                                        );
                                    })}
                                    {sortedDays.length > 0 && (
                                        <tr className="bg-gray-100 font-bold">
                                            <td className="border border-gray-300 p-3">TỔNG CỘNG</td>
                                            <td className="border border-gray-300 p-3 text-right text-green-600">
                                                {monthlyTotals.examTotal.toLocaleString()}k
                                            </td>
                                            <td className="border border-gray-300 p-3 text-right text-blue-600">
                                                {monthlyTotals.doctorTotal.toLocaleString()}k
                                            </td>
                                            <td className="border border-gray-300 p-3 text-right text-orange-600">
                                                {monthlyTotals.expenseTotal.toLocaleString()}k
                                            </td>
                                            <td className="border border-gray-300 p-3 text-right text-purple-600">
                                                {monthlyTotals.medicineTotal.toLocaleString()}k
                                            </td>
                                            {selectedBranch === 'thot-not' && (
                                                <td className="border border-gray-300 p-3 text-right text-teal-600">
                                                    +{monthlyTotals.transferredMedicine.toLocaleString()}k
                                                </td>
                                            )}
                                            <td className={`border border-gray-300 p-3 text-right ${monthlyTotals.netTotal >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                                                {monthlyTotals.netTotal.toLocaleString()}k
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
</body>
</html>
