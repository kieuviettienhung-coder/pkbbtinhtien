        // Helper: Chuyển đổi dữ liệu cũ (examinations & patientDetails) sang mảng danh sách toa thống nhất (prescriptions)
        function convertOldDataToPrescriptions(examinations = {}, patientDetails = {}) {
            const list = [];
            const usedCounts = {};

            // 1. Lấy tất cả bệnh nhân từ patientDetails
            Object.entries(patientDetails || {}).forEach(([price, patients]) => {
                if (Array.isArray(patients)) {
                    patients.forEach((p, idx) => {
                        const name = p && p.name ? String(p.name).trim() : '';
                        const prescriptionNo = p && p.prescriptionNo ? String(p.prescriptionNo).trim() : '';
                        const paymentMethod = p && p.paymentMethod === 'transfer' ? 'transfer' : 'cash';
                        const priceNum = parseFloat(price) || 0;
                        
                        list.push({
                            id: 'rx_' + price + '_' + idx + '_' + Math.random().toString(36).substring(2, 7),
                            prescriptionNo,
                            name,
                            price: priceNum,
                            paymentMethod
                        });
                        usedCounts[price] = (usedCounts[price] || 0) + 1;
                    });
                }
            });

            // 2. Nếu examinations có số ca chưa có trong patientDetails (do nhân viên chỉ gõ số lượng ngoài ô mức giá)
            Object.entries(examinations || {}).forEach(([price, count]) => {
                const c = parseInt(count || 0, 10);
                const used = usedCounts[price] || 0;
                const missing = c - used;
                const priceNum = parseFloat(price) || 0;
                for (let i = 0; i < missing; i++) {
                    list.push({
                        id: 'rx_gen_' + price + '_' + i + '_' + Math.random().toString(36).substring(2, 7),
                        prescriptionNo: '',
                        name: '',
                        price: priceNum,
                        paymentMethod: 'cash'
                    });
                }
            });

            // 3. Sắp xếp danh sách theo STT toa (số thứ tự trước, chữ sau, dòng trống cuối cùng)
            list.sort((a, b) => {
                const isNumA = /^\d+$/.test(a.prescriptionNo);
                const isNumB = /^\d+$/.test(b.prescriptionNo);
                if (isNumA && isNumB) return parseInt(a.prescriptionNo, 10) - parseInt(b.prescriptionNo, 10);
                if (isNumA) return -1;
                if (isNumB) return 1;
                if (a.prescriptionNo && !b.prescriptionNo) return -1;
                if (!a.prescriptionNo && b.prescriptionNo) return 1;
                return (a.prescriptionNo || '').localeCompare(b.prescriptionNo || '');
            });

            return list;
        }

        function convertPrescriptionsToOldFormat(prescriptions = []) {
            const examinations = {};
            const patientDetails = {};

            (prescriptions || []).forEach(p => {
                const hasPrice = p.price !== '' && p.price !== null && p.price !== undefined && !isNaN(parseFloat(p.price));
                const hasStt = p.prescriptionNo !== undefined && p.prescriptionNo !== null && String(p.prescriptionNo).trim() !== '';
                const hasName = p.name !== undefined && p.name !== null && String(p.name).trim() !== '';

                if (!hasPrice && !hasStt && !hasName) return; // bỏ qua các dòng trống hoàn toàn

                const priceNum = hasPrice ? parseFloat(p.price) : 0;
                const priceKey = priceNum.toString();

                examinations[priceKey] = ((parseInt(examinations[priceKey], 10) || 0) + 1).toString();

                if (!patientDetails[priceKey]) patientDetails[priceKey] = [];
                patientDetails[priceKey].push({
                    prescriptionNo: hasStt ? String(p.prescriptionNo).trim() : '',
                    name: hasName ? String(p.name).trim() : '',
                    paymentMethod: p.paymentMethod === 'transfer' ? 'transfer' : 'cash'
                });
            });

            return { examinations, patientDetails };
        }

        // Yearly Report View Component
        function YearlyReportView({ selectedBranch, selectedDate, yearlyData, ngaBayYearlyData = {} }) {
            const year = selectedDate.substring(0, 4);
            const [medSearchTerm, setMedSearchTerm] = useState('');
            const [medBranchTab, setMedBranchTab] = useState(selectedBranch === 'thot-not' ? 'nga-bay' : 'current');
            const [expandedYearlyMedName, setExpandedYearlyMedName] = useState(null);

            const toggleExpandYearlyMed = (name) => {
                setExpandedYearlyMedName(prev => prev === name ? null : name);
            };

            const aggregateYearlyMedicines = (dataSource) => {
                const map = {};
                Object.entries(dataSource || {}).forEach(([dateKey, dayData]) => {
                    if (!dayData || !Array.isArray(dayData.medicines)) return;
                    const dateStr = dayData.date || `${dateKey.substring(6, 8)}/${dateKey.substring(4, 6)}`;
                    dayData.medicines.forEach(m => {
                        if (!m || !m.name) return;
                        const name = m.name.trim();
                        if (!name) return;
                        const qty = parseFloat(m.quantity || 0);
                        const price = parseFloat(m.price || 0);
                        if (qty <= 0 && price <= 0) return;
                        
                        if (!map[name]) {
                            map[name] = {
                                name,
                                price: price,
                                totalQuantity: 0,
                                totalAmount: 0,
                                days: new Set(),
                                dailyBreakdown: []
                            };
                        }
                        map[name].totalQuantity += qty;
                        map[name].totalAmount += (qty * price);
                        if (price > 0 && (!map[name].price || map[name].price === 0)) {
                            map[name].price = price;
                        }
                        map[name].days.add(dateStr);

                        const existingDay = map[name].dailyBreakdown.find(d => d.dateKey === dateKey);
                        if (existingDay) {
                            existingDay.quantity += qty;
                            existingDay.total += (qty * price);
                        } else {
                            map[name].dailyBreakdown.push({
                                dateKey,
                                date: dateStr,
                                quantity: qty,
                                price: price,
                                total: qty * price
                            });
                        }
                    });
                });

                return Object.values(map).map(item => ({
                    ...item,
                    daysCount: item.days.size,
                    daysList: Array.from(item.days),
                    dailyBreakdown: item.dailyBreakdown.sort((a, b) => a.dateKey.localeCompare(b.dateKey))
                })).sort((a, b) => b.totalQuantity - a.totalQuantity || b.totalAmount - a.totalAmount);
            };

            const ngaBayYearlyMeds = aggregateYearlyMedicines(selectedBranch === 'thot-not' ? ngaBayYearlyData : yearlyData);
            const thotNotYearlyMeds = aggregateYearlyMedicines(yearlyData);
            const activeYearlyMeds = selectedBranch === 'thot-not'
                ? (medBranchTab === 'nga-bay' ? ngaBayYearlyMeds : thotNotYearlyMeds)
                : ngaBayYearlyMeds;

            const filteredYearlyMeds = activeYearlyMeds.filter(m =>
                m.name.toLowerCase().includes(medSearchTerm.toLowerCase().trim())
            );

            const totalYearlyMedQty = activeYearlyMeds.reduce((sum, m) => sum + m.totalQuantity, 0);
            const totalYearlyMedAmount = activeYearlyMeds.reduce((sum, m) => sum + m.totalAmount, 0);
            const totalFilteredYearlyQty = filteredYearlyMeds.reduce((sum, m) => sum + m.totalQuantity, 0);
            const totalFilteredYearlyAmount = filteredYearlyMeds.reduce((sum, m) => sum + m.totalAmount, 0);

            // Group data by month
            const monthlyGroups = {};
            for (let month = 1; month <= 12; month++) {
                const monthKey = month.toString().padStart(2, '0');
                monthlyGroups[monthKey] = [];
            }

            Object.entries(yearlyData).forEach(([dateKey, dayData]) => {
                const month = dateKey.substring(4, 6);
                if (monthlyGroups[month]) {
                    monthlyGroups[month].push(dayData);
                }
            });

            const calculateMonthTotals = (monthKey, monthData) => {
                let examTotal = 0, examCashTotal = 0, examTransferTotal = 0;
                let doctorTotal = 0, expenseTotal = 0, medicineTotal = 0, totalCases = 0, zeroCases = 0;

                monthData.forEach(dayData => {
                    const dayExam = Object.entries(dayData.examinations || {})
                        .filter(([price, count]) => count && parseFloat(count) > 0)
                        .reduce((sum, [price, count]) => {
                            return sum + (parseFloat(price) * parseFloat(count));
                        }, 0);
                    examTotal += dayExam;

                    let dayTransfer = 0;
                    Object.entries(dayData.patientDetails || {}).forEach(([price, patients]) => {
                        if (Array.isArray(patients)) {
                            patients.forEach(p => {
                                if (p && p.paymentMethod === 'transfer') {
                                    dayTransfer += parseFloat(price || 0);
                                }
                            });
                        }
                    });
                    examTransferTotal += dayTransfer;
                    examCashTotal += (dayExam - dayTransfer);

                    doctorTotal += (dayData.doctorFees || []).reduce((sum, fee) => {
                        return sum + parseFloat(fee.amount || 0);
                    }, 0);

                    expenseTotal += (dayData.expenses || []).reduce((sum, exp) => {
                        return sum + parseFloat(exp.amount || 0);
                    }, 0);

                    medicineTotal += (dayData.medicines || []).reduce((sum, med) => {
                        return sum + (parseFloat(med.quantity || 0) * parseFloat(med.price || 0));
                    }, 0);

                    totalCases += Object.entries(dayData.examinations || {})
                        .filter(([price, count]) => count && parseFloat(count) > 0)
                        .reduce((sum, [price, count]) => {
                            return sum + parseInt(count);
                        }, 0);
                    
                    // Đếm số ca 0 đồng
                    zeroCases += parseInt(dayData.examinations?.['0'] || 0);
                });

                // Transferred medicine from Nga Bay for this month (when viewing Thot Not)
                let transferredMedicine = 0;
                if (selectedBranch === 'thot-not') {
                    Object.entries(ngaBayYearlyData).forEach(([dKey, nbDay]) => {
                        if (dKey.substring(4, 6) === monthKey && Array.isArray(nbDay.medicines)) {
                            transferredMedicine += nbDay.medicines.reduce((sum, m) => sum + (parseFloat(m.quantity || 0) * parseFloat(m.price || 0)), 0);
                        }
                    });
                }

                const branchOwnNet = examTotal - doctorTotal - expenseTotal - medicineTotal;
                const netCash = examCashTotal - doctorTotal - expenseTotal - medicineTotal;
                const netTransfer = examTransferTotal;
                const netTotal = branchOwnNet + transferredMedicine;

                return {
                    examTotal,
                    examCashTotal,
                    examTransferTotal,
                    doctorTotal,
                    expenseTotal,
                    medicineTotal,
                    transferredMedicine,
                    totalCases,
                    zeroCases,
                    branchOwnNet,
                    netCash,
                    netTransfer,
                    netTotal
                };
            };

            const monthlyTotals = Object.entries(monthlyGroups).map(([month, data]) => ({
                month,
                ...calculateMonthTotals(month, data)
            }));

            const yearTotal = monthlyTotals.reduce((acc, month) => ({
                examTotal: acc.examTotal + month.examTotal,
                examCashTotal: acc.examCashTotal + month.examCashTotal,
                examTransferTotal: acc.examTransferTotal + month.examTransferTotal,
                doctorTotal: acc.doctorTotal + month.doctorTotal,
                expenseTotal: acc.expenseTotal + month.expenseTotal,
                medicineTotal: acc.medicineTotal + month.medicineTotal,
                transferredMedicine: acc.transferredMedicine + month.transferredMedicine,
                totalCases: acc.totalCases + month.totalCases,
                zeroCases: acc.zeroCases + month.zeroCases,
                branchOwnNet: acc.branchOwnNet + month.branchOwnNet,
                netCash: acc.netCash + month.netCash,
                netTransfer: acc.netTransfer + month.netTransfer,
                netTotal: acc.netTotal + month.netTotal
            }), { 
                examTotal: 0, 
                examCashTotal: 0, 
                examTransferTotal: 0,

        // Helper to analyze prescription sequence (detect missing / jumped numbers)
        function getSequenceAnalysis(patientDetails, checkFromOne = true) {
            const list = [];
            const duplicates = [];
            const seen = new Map();

            Object.entries(patientDetails || {}).forEach(([price, patients]) => {
                if (Array.isArray(patients)) {
                    patients.forEach((p) => {
                        const raw = p && p.prescriptionNo ? String(p.prescriptionNo).trim() : '';
                        if (raw) {
                            const isNum = /^\d+$/.test(raw);
                            const num = isNum ? parseInt(raw, 10) : null;
                            const item = {
                                price,
                                name: p && p.name ? String(p.name).trim() : 'Chưa có tên',
                                paymentMethod: p && p.paymentMethod === 'transfer' ? 'transfer' : 'cash',
                                rawStt: raw,
                                num,
                                isNum
                            };
                            list.push(item);

                            const key = raw.toLowerCase();
                            if (seen.has(key)) {
                                duplicates.push({ stt: raw, current: item, previous: seen.get(key) });
                            } else {
                                seen.set(key, item);
                            }
                        }
                    });
                }
            });

            const numericItems = list.filter(item => item.isNum);
            const nonNumericItems = list.filter(item => !item.isNum);

            if (numericItems.length === 0) {
                return {
                    total: list.length,
                    numericCount: 0,
                    hasJumps: false,
                    missingNumbers: [],
                    min: null,
                    max: null,
                    items: list,
                    numericItems: [],
                    nonNumericItems,
                    duplicates,
                    sequenceList: []
                };
            }

            const numbers = numericItems.map(item => item.num);
            const min = Math.min(...numbers);
            const max = Math.max(...numbers);

            const mapByNum = new Map();
            numericItems.forEach(item => {
                if (!mapByNum.has(item.num)) {
                    mapByNum.set(item.num, []);
                }
                mapByNum.get(item.num).push(item);
            });

            const startNum = checkFromOne ? 1 : min;
            const missingNumbers = [];
            const sequenceList = [];

            for (let i = startNum; i <= max; i++) {
                if (mapByNum.has(i)) {
                    sequenceList.push({
                        num: i,
                        status: 'present',
                        patients: mapByNum.get(i)
                    });
                } else {
                    missingNumbers.push(i);
                    sequenceList.push({
                        num: i,
                        status: 'missing',
                        patients: []
                    });
                }
            }

            return {
                total: list.length,
                numericCount: numericItems.length,
                hasJumps: missingNumbers.length > 0,
                missingNumbers,
                min,
                max,
                items: list,
                numericItems,
                nonNumericItems,
                duplicates,
                sequenceList
            };
        }

                    if (paymentFilter !== 'all') {
                        if (item.status === 'missing') return false;
                        if (paymentFilter === 'transfer') {
                            const hasTransfer = item.patients.some(p => p.paymentMethod === 'transfer');
                            if (!hasTransfer) return false;
                        } else if (paymentFilter === 'cash') {
                            const hasCash = item.patients.some(p => p.paymentMethod !== 'transfer');
                            if (!hasCash) return false;

        // Helper: Sinh nội dung HTML cho máy in nhiệt (K80 / K58)
        function generateThermalBillHtml({
            prescriptionNo = '',

            const is58 = paperSize === '58mm';
            const maxWidth = is58 ? '52mm' : '72mm';
            const fontSize = is58 ? '11px' : '13px';
            const titleSize = is58 ? '14px' : '16px';
            const totalSize = is58 ? '14px' : '16px';
            
            const priceNum = parseFloat(price || 0);
            const amountStr = priceNum === 0 ? '0 đ' : (priceNum * 1000).toLocaleString('vi-VN') + ' đ';

            const dateFormatted = date ? date.split('-').reverse().join('/') : new Date().toLocaleDateString('vi-VN');
            const timeFormatted = time || new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

            return `
                <div style="width: 100%; max-width: ${maxWidth}; margin: 0 auto; padding: 2mm 1mm; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: ${fontSize}; line-height: 1.35; color: #000; background: #fff;">
                    <!-- Header Phòng khám -->
                    <div style="text-align: center; margin-bottom: 5px;">
                        <div style="font-weight: 900; font-size: ${titleSize}; text-transform: uppercase;">Phòng Khám Bách Bảo</div>
                        <div style="font-size: ${is58 ? '10px' : '12px'}; font-weight: 600; margin-top: 2px;">${branchName}</div>
                        <div style="font-size: ${is58 ? '10px' : '12px'}; font-weight: 700; margin-top: 1px;">📞 Hotline: 0939 994 992</div>
                        <div style="margin: 5px 0; border-top: 1px dashed #000;"></div>
                        <div style="font-weight: 800; font-size: ${is58 ? '12px' : '14px'}; text-transform: uppercase;">PHIẾU THANH TOÁN</div>
                    </div>

                    <!-- Thông tin toa & thời gian -->
                    <div style="margin-bottom: 5px;">
                        <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 2px;">

                        <div style="margin-bottom: 2px;">
                            <span>Toa số: </span>

                            <span>Bé: </span>
                            <span style="font-weight: 700;">${name && name.trim() ? name.trim() : '---'}</span>
                        </div>
                    </div>

                    <!-- Bảng nội dung thu tiền -->
                    <div style="border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 4px 0; margin-bottom: 5px;">
                        <div style="display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 3px; font-size: ${is58 ? '10px' : '11px'}; text-transform: uppercase;">
                            <span>Nội dung</span>
                            <span>Thành tiền</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span>Khám bệnh & Thuốc</span>
                            <span style="font-weight: 700;">${amountStr}</span>
                        </div>
                    </div>

                    <!-- Tổng cộng & Hình thức thanh toán -->
                    <div style="margin-bottom: 6px;">
                        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px;">
                            <span style="font-weight: 800; font-size: ${totalSize};">TỔNG CỘNG:</span>

                    ${note && note.trim() ? `

                    <!-- Lời cảm ơn & Chúc bé khỏe -->

        // Helper căn giữa và 2 cột cho văn bản in nhiệt RawBT
        function centerTextForReceipt(str, width) {
            str = String(str || '').trim();
            if (str.length >= width) return str;
            const pad = Math.floor((width - str.length) / 2);
            return ' '.repeat(pad) + str;
        }

        function rowTwoColForReceipt(left, right, width) {
            left = String(left || '');
            right = String(right || '');
            const spaces = width - left.length - right.length;
            if (spaces <= 0) return left + ' ' + right;
            return left + ' '.repeat(spaces) + right;
        }

        // Helper: Sinh nội dung dạng Text thuần túy cho app RawBT (nhận dạng tức thì, in trong 1 giây)
        function generateThermalBillText({
            prescriptionNo = '',
            name = '',
            price = '',
            paymentMethod = 'cash',
            branch = 'nga-bay',
            date = '',
            time = '',
            note = '',
            paperSize = '80mm'
        }) {
            const is58 = paperSize === '58mm';
            const width = is58 ? 32 : 40;
            const divider = '='.repeat(width);
            const dashed = '-'.repeat(width);

            const branchName = branch === 'thot-not' ? 'Chi nhánh Thốt Nốt' : 'Chi nhánh Ngã Bảy';
            const priceNum = parseFloat(price || 0);
            const amountStr = priceNum === 0 ? '0 đ' : (priceNum * 1000).toLocaleString('vi-VN') + ' đ';
            const paymentMethodText = paymentMethod === 'transfer' ? 'Chuyển khoản' : 'Tiền mặt';
            const dateFormatted = date ? date.split('-').reverse().join('/') : new Date().toLocaleDateString('vi-VN');
            const timeFormatted = time || new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

            let lines = [];
            lines.push(divider);
            lines.push(centerTextForReceipt('PHÒNG KHÁM BÁCH BẢO', width));
            lines.push(centerTextForReceipt(branchName, width));
            lines.push(centerTextForReceipt('Hotline: 0939 994 992', width));
            lines.push(dashed);
            lines.push(centerTextForReceipt('PHIẾU THANH TOÁN', width));
            lines.push(dashed);
            lines.push(rowTwoColForReceipt('Ngày: ' + dateFormatted, 'Giờ: ' + timeFormatted, width));
            lines.push('Toa số: #' + (prescriptionNo || '---'));
            lines.push('Bé: ' + (name && name.trim() ? name.trim() : '---'));
            lines.push(dashed);
            lines.push(rowTwoColForReceipt('Nội dung', 'Thành tiền', width));
            lines.push(rowTwoColForReceipt('Khám bệnh & Thuốc', amountStr, width));
            lines.push(dashed);
            lines.push(rowTwoColForReceipt('TỔNG CỘNG:', amountStr, width));
            lines.push(rowTwoColForReceipt('Hình thức:', paymentMethodText, width));

            if (note && note.trim()) {
                lines.push(dashed);
                lines.push('Lời dặn: ' + note.trim());
            }

            lines.push(dashed);
            lines.push(centerTextForReceipt('❤️ Chúc bé mau khỏe! ❤️', width));
            if (is58) {
                lines.push(centerTextForReceipt('(Lưu ý: chỉ thanh toán', width));
                lines.push(centerTextForReceipt('đúng số tiền trong bill)', width));
            } else {
                lines.push(centerTextForReceipt('(Quý khách lưu ý chỉ thanh toán đúng bill)', width));
            }
            lines.push(centerTextForReceipt('Cảm ơn Quý khách & Hẹn gặp lại!', width));
            lines.push(divider);
            lines.push('\n\n\n'); // Đẩy giấy qua dao cắt

            return lines.join('\n');
        }

        // Modal xem trước và in bill cho máy in nhiệt
        function BillPrintModal({ bill, onClose }) {
            const [paperSize, setPaperSize] = useState('80mm');
            const [note, setNote] = useState('');
            const [timeString] = useState(() => {
                const now = new Date();
                return now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            });

            if (!bill) return null;

            const recordPrintLog = () => {
                try {
                    const branchKey = bill.branch || 'nga-bay';
                    const rawDate = bill.date || new Date().toISOString().split('T')[0];
                    const dateKey = String(rawDate).replace(/-/g, '');
                    const now = new Date();
                    const printRecord = {
                        prescriptionNo: String(bill.prescriptionNo || '').trim(),
                        name: String(bill.name || '').trim(),
                        price: bill.price !== undefined && bill.price !== null ? String(bill.price) : '0',
                        paymentMethod: bill.paymentMethod || 'cash',
                        branch: branchKey,
                        date: rawDate,
                        dateKey: dateKey,
                        printedAt: now.toISOString(),
                        printedTime: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                        timestamp: (typeof firebase !== 'undefined' && firebase.database && firebase.database.ServerValue) ? firebase.database.ServerValue.TIMESTAMP : Date.now(),
                        note: String(note || '').trim(),
                        paperSize: paperSize
                    };

                    if (typeof db !== 'undefined' && db && db.ref) {
                        db.ref(`printLogs_v2/${branchKey}/${dateKey}`).push(printRecord);
                    }
                } catch (logErr) {
                    console.error('Lỗi ghi log in bill:', logErr);
                }
            };

            const handleExecutePrint = () => {
                const printPortal = document.getElementById('thermal-print-portal');
                if (printPortal) {
                    printPortal.innerHTML = generateThermalBillHtml({
                        prescriptionNo: bill.prescriptionNo,
                        name: bill.name,
                        price: bill.price,
                        paymentMethod: bill.paymentMethod,
                        branch: bill.branch,
                        date: bill.date,
                        time: timeString,
                        note: note,
                        paperSize: paperSize
                    });
                    // Kích hoạt render lại layout để trình duyệt hoàn tất tính toán DOM trước khi mở print dialog
                    void printPortal.offsetHeight;
                }

                recordPrintLog();
                setTimeout(() => {
                    window.print();
                }, 150);
            };

            const [copied, setCopied] = useState(false);

            const handleRawBTPrint = () => {
                recordPrintLog();

                const billText = generateThermalBillText({

                    time: timeString,

                    paperSize: paperSize
                });

                try {
                    const encodedText = encodeURIComponent(billText);
                    const playStoreUrl = encodeURIComponent("https://play.google.com/store/apps/details?id=ru.a402d.rawbtprinter");
                    const intentUrl = `intent:${encodedText}#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;S.browser_fallback_url=${playStoreUrl};end;`;
                    window.location.href = intentUrl;
                } catch (e) {

            const handleCopyText = () => {

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-3 overflow-y-auto">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-gray-100 animate-fadeIn my-auto">

        // ==========================================
        // GIAO DIỆN TỔNG HỢP & GIÁM SÁT BILL IN TRONG NGÀY (DÀNH CHO ADMIN)
        // ==========================================
        function PrintSummaryReportView({ selectedBranch: propBranch, selectedDate: propDate, allowedBranch, isMasterAdmin }) {
            const [currentBranch, setCurrentBranch] = useState(() => {
                if (allowedBranch && allowedBranch !== 'all') return allowedBranch;
                return propBranch || 'nga-bay';
            });
            const [currentDate, setCurrentDate] = useState(() => {
                return propDate || new Date().toISOString().split('T')[0];
            });

            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [dailyPrescriptions, setDailyPrescriptions] = useState([]);

            const [filterTab, setFilterTab] = useState('all'); // 'all' | 'duplicates' | 'cash' | 'transfer'
            const [searchTerm, setSearchTerm] = useState('');
            const [sortAsc, setSortAsc] = useState(false); // false = mới nhất trước
            const [billToReprint, setBillToReprint] = useState(null);

            // Đồng bộ dữ liệu in từ Firebase Realtime Database
            useEffect(() => {
                setLoading(true);
                const dateKey = String(currentDate).replace(/-/g, '');
                const refsToOff = [];

                if (currentBranch === 'all') {
                    const nbRef = db.ref(`printLogs_v2/nga-bay/${dateKey}`);
                    const tnRef = db.ref(`printLogs_v2/thot-not/${dateKey}`);
                    refsToOff.push(nbRef, tnRef);

                    let nbLogs = [];
                    let tnLogs = [];

                    const updateCombined = () => {
                        setLogs([...nbLogs, ...tnLogs]);
                        setLoading(false);
                    };

                    nbRef.on('value', (snap) => {
                        const val = snap.val() || {};
                        nbLogs = Object.entries(val).map(([key, item]) => ({
                            id: key,
                            ...item,
                            branch: item.branch || 'nga-bay'
                        }));
                        updateCombined();
                    });

                    tnRef.on('value', (snap) => {
                        const val = snap.val() || {};
                        tnLogs = Object.entries(val).map(([key, item]) => ({
                            id: key,
                            ...item,
                            branch: item.branch || 'thot-not'
                        }));
                        updateCombined();
                    });

                    // So sánh với sổ khám 2 chi nhánh
                    const nbDailyRef = db.ref(`daily_v2/nga-bay/${dateKey}`);
                    const tnDailyRef = db.ref(`daily_v2/thot-not/${dateKey}`);
                    refsToOff.push(nbDailyRef, tnDailyRef);
                    let nbRx = [];
                    let tnRx = [];
                    const updateDailyCombined = () => setDailyPrescriptions([...nbRx, ...tnRx]);

                    nbDailyRef.on('value', (snap) => {
                        const val = snap.val();
                        nbRx = (val && Array.isArray(val.prescriptions)) ? val.prescriptions.map(p => ({ ...p, branch: 'nga-bay' })) : [];
                        updateDailyCombined();
                    });
                    tnDailyRef.on('value', (snap) => {
                        const val = snap.val();
                        tnRx = (val && Array.isArray(val.prescriptions)) ? val.prescriptions.map(p => ({ ...p, branch: 'thot-not' })) : [];
                        updateDailyCombined();
                    });
                } else {
                    const branchRef = db.ref(`printLogs_v2/${currentBranch}/${dateKey}`);
                    refsToOff.push(branchRef);
                    branchRef.on('value', (snap) => {
                        const val = snap.val() || {};
                        const list = Object.entries(val).map(([key, item]) => ({
                            id: key,
                            ...item,
                            branch: item.branch || currentBranch
                        }));
                        setLogs(list);
                        setLoading(false);
                    });

                    const dailyRef = db.ref(`daily_v2/${currentBranch}/${dateKey}`);
                    refsToOff.push(dailyRef);
                    dailyRef.on('value', (snap) => {
                        const val = snap.val();
                        const list = (val && Array.isArray(val.prescriptions)) ? val.prescriptions.map(p => ({ ...p, branch: currentBranch })) : [];
                        setDailyPrescriptions(list);
                    });
                }

                return () => {
                    refsToOff.forEach(r => {
                        if (r && r.off) r.off();
                    });
                };
            }, [currentBranch, currentDate]);

            // Helper tính độ trễ thời gian giữa 2 lần in
            const getTimeDiffText = (earlierStr, laterStr) => {
                if (!earlierStr || !laterStr) return '';
                const t1 = new Date(earlierStr).getTime();
                const t2 = new Date(laterStr).getTime();
                if (isNaN(t1) || isNaN(t2)) return '';
                const diffMs = Math.abs(t2 - t1);
                const diffSec = Math.floor(diffMs / 1000);
                if (diffSec < 60) return `${diffSec} giây`;
                const diffMin = Math.floor(diffSec / 60);
                const remSec = diffSec % 60;
                if (diffMin < 60) return `${diffMin} phút ${remSec > 0 ? remSec + 's' : ''}`;
                const diffHr = Math.floor(diffMin / 60);
                const remMin = diffMin % 60;
                return `${diffHr} giờ ${remMin > 0 ? remMin + 'p' : ''}`;
            };

            // Gom nhóm theo số toa để phát hiện chính xác bill nào được in nhiều lần
            const groupedByRx = useMemo(() => {
                const map = {};
                logs.forEach(log => {
                    const rawNo = log.prescriptionNo ? String(log.prescriptionNo).trim() : '';
                    const groupKey = currentBranch === 'all' 
                        ? `${log.branch || 'nga-bay'}__${rawNo || ('unnamed_' + log.id)}` 
                        : (rawNo || ('unnamed_' + log.id));

                    if (!map[groupKey]) {
                        map[groupKey] = {
                            key: groupKey,
                            prescriptionNo: rawNo,
                            branch: log.branch || 'nga-bay',
                            prints: []
                        };
                    }
                    map[groupKey].prints.push(log);
                });

                // Sắp xếp các lần in theo thứ tự thời gian tăng dần
                Object.values(map).forEach(group => {
                    group.prints.sort((a, b) => {
                        const tA = a.timestamp || (a.printedAt ? new Date(a.printedAt).getTime() : 0);
                        const tB = b.timestamp || (b.printedAt ? new Date(b.printedAt).getTime() : 0);
                        return tA - tB;
                    });
                    // Gắn nhãn thứ tự lần in (Lần 1, Lần 2/2...)
                    group.prints.forEach((p, idx) => {
                        p.printIndex = idx + 1;
                        p.totalPrints = group.prints.length;
                        p.isDuplicate = group.prints.length > 1;
                    });
                });

                return map;
            }, [logs, currentBranch]);

            // Danh sách các bill bị in từ 2 lần trở lên
            const duplicateGroups = useMemo(() => {
                return Object.values(groupedByRx).filter(g => g.prints.length > 1 && g.prescriptionNo);
            }, [groupedByRx]);

            // Tổng hợp các chỉ số KPI
            const stats = useMemo(() => {
                const totalPrints = logs.length;
                const uniqueRxCount = Object.keys(groupedByRx).length;
                const duplicateRxCount = duplicateGroups.length;
                const duplicateAttemptsCount = duplicateGroups.reduce((acc, g) => acc + (g.prints.length - 1), 0);

                let uniqueRevenueK = 0;
                let uniqueCashK = 0;
                let uniqueTransferK = 0;
                let totalCashPrints = 0;
                let totalTransferPrints = 0;

                Object.values(groupedByRx).forEach(group => {
                    const firstPrint = group.prints[0];
                    const p = parseFloat(firstPrint.price || 0);
                    if (!isNaN(p)) {
                        uniqueRevenueK += p;
                        if (firstPrint.paymentMethod === 'transfer') {
                            uniqueTransferK += p;
                        } else {
                            uniqueCashK += p;
                        }
                    }
                });

                logs.forEach(l => {
                    if (l.paymentMethod === 'transfer') totalTransferPrints++;
                    else totalCashPrints++;
                });

                let totalVolumeK = 0;
                logs.forEach(l => {
                    const p = parseFloat(l.price || 0);
                    if (!isNaN(p)) totalVolumeK += p;
                });

                // Đối chiếu với sổ khám
                const printedRxSet = new Set(
                    logs.map(l => (currentBranch === 'all' ? `${l.branch}__${String(l.prescriptionNo).trim()}` : String(l.prescriptionNo).trim()))
                        .filter(Boolean)
                );
                const unprintedRx = dailyPrescriptions.filter(p => {
                    const no = String(p.prescriptionNo || '').trim();
                    if (!no) return false;
                    const key = currentBranch === 'all' ? `${p.branch}__${no}` : no;
                    return !printedRxSet.has(key);
                });

                return {
                    totalPrints,
                    uniqueRxCount,
                    duplicateRxCount,
                    duplicateAttemptsCount,
                    uniqueRevenueK,
                    uniqueCashK,
                    uniqueTransferK,
                    totalCashPrints,
                    totalTransferPrints,
                    totalVolumeK,
                    unprintedRx
                };
            }, [logs, groupedByRx, duplicateGroups, dailyPrescriptions, currentBranch]);

            // Lọc và tìm kiếm danh sách lượt in
            const filteredLogs = useMemo(() => {
                let list = [...logs];

                if (filterTab === 'duplicates') {
                    list = list.filter(l => l.isDuplicate);
                } else if (filterTab === 'cash') {
                    list = list.filter(l => l.paymentMethod === 'cash');
                } else if (filterTab === 'transfer') {
                    list = list.filter(l => l.paymentMethod === 'transfer');
                }

                if (searchTerm.trim()) {
                    const term = searchTerm.trim().toLowerCase();
                    list = list.filter(l => {
                        const rx = String(l.prescriptionNo || '').toLowerCase();
                        const name = String(l.name || '').toLowerCase();
                        const price = String(l.price || '').toLowerCase();
                        const note = String(l.note || '').toLowerCase();
                        const time = String(l.printedTime || '').toLowerCase();
                        return rx.includes(term) || name.includes(term) || price.includes(term) || note.includes(term) || time.includes(term);
                    });
                }

                list.sort((a, b) => {
                    const tA = a.timestamp || (a.printedAt ? new Date(a.printedAt).getTime() : 0);
                    const tB = b.timestamp || (b.printedAt ? new Date(b.printedAt).getTime() : 0);
                    return sortAsc ? tA - tB : tB - tA;
                });

                return list;
            }, [logs, filterTab, searchTerm, sortAsc]);

            // Xuất báo cáo bill in ra file Excel (XLSX)
            const handleExportExcel = () => {
                if (!logs || logs.length === 0) {
                    alert('⚠️ Chưa có dữ liệu in bill để xuất Excel!');
                    return;
                }
                try {
                    const rows = logs.map((log, idx) => ({
                        'STT': idx + 1,
                        'Giờ in': log.printedTime || '',
                        'Ngày': log.date || currentDate,
                        'Chi nhánh': log.branch === 'thot-not' ? 'Thốt Nốt' : 'Ngã Bảy',
                        'Số toa': log.prescriptionNo || '',
                        'Bệnh nhân': log.name || '',
                        'Tiền khám (k)': log.price || 0,
                        'Thành tiền (VNĐ)': (parseFloat(log.price || 0) * 1000),
                        'Hình thức TT': log.paymentMethod === 'transfer' ? 'Chuyển khoản' : 'Tiền mặt',
                        'Khổ giấy': log.paperSize || '80mm',
                        'Lần in': log.printIndex ? `Lần ${log.printIndex}/${log.totalPrints}` : '1',
                        'Cảnh báo in trùng': log.isDuplicate ? 'CÓ (In nhiều lần)' : 'Không',
                        'Lời dặn / Ghi chú': log.note || ''
                    }));

                    const worksheet = XLSX.utils.json_to_sheet(rows);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, 'BangKeBillIn');
                    const branchTag = currentBranch === 'all' ? '2CN' : currentBranch;
                    const dateTag = currentDate.replace(/-/g, '');
                    XLSX.writeFile(workbook, `Tong_hop_bill_in_${branchTag}_${dateTag}.xlsx`);
                } catch (err) {
                    console.error('Export error:', err);
                    alert('Lỗi xuất Excel: ' + err.message);
                }
            };

            // Xóa lượt in (chỉ Admin mới có nút này, dùng khi in test hoặc cần điều chỉnh)
            const handleDeleteLog = async (log) => {
                if (!confirm(`⚠️ Bạn có chắc chắn muốn xóa bản ghi in của Toa #${log.prescriptionNo || '---'} lúc ${log.printedTime}?\n\n(Lưu ý: Thao tác này chỉ xóa bản ghi lịch sử in bill, không xóa toa khám trong sổ sách)`)) {
                    return;
                }
                try {
                    const branchKey = log.branch || currentBranch || 'nga-bay';
                    const dateKey = log.dateKey || currentDate.replace(/-/g, '');
                    await db.ref(`printLogs_v2/${branchKey}/${dateKey}/${log.id}`).remove();
                } catch (e) {
                    alert('Lỗi khi xóa: ' + e.message);
                }
            };

            const formattedDateVi = currentDate ? currentDate.split('-').reverse().join('/') : '';

            return (
                <div className="space-y-6 animate-fadeIn pb-12">
                    {/* Hero Header & Bộ chọn chi nhánh / ngày */}
                    <div className="bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 rounded-2xl p-4 sm:p-6 text-white shadow-xl">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="text-2xl sm:text-3xl">🖨️</span>
                                    <h2 className="text-xl sm:text-2xl font-black tracking-tight">
                                        Tổng Hợp & Giám Sát Bill In Trong Ngày
                                    </h2>
                                </div>
                                <p className="text-xs sm:text-sm text-blue-100 font-medium">
                                    Quản lý và đối chiếu lịch sử in máy in nhiệt K80/K58. Tự động phát hiện và cảnh báo các bill in lặp lại.
                                </p>
                            </div>

                            <div className="flex flex-wrap items-center gap-2">
                                <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-500/20 text-emerald-200 border border-emerald-400/30 text-xs font-bold backdrop-blur-xs">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                    <span>Real-time Sync</span>
                                </span>
                                <button
                                    type="button"
                                    onClick={handleExportExcel}
                                    className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-xl text-xs sm:text-sm font-bold shadow-md transition flex items-center gap-1.5"
                                    title="Xuất danh sách ra file Excel"
                                >
                                    <span>📊</span>
                                    <span>Xuất Excel</span>
                                </button>
                            </div>
                        </div>

                        {/* Thanh chọn nhanh Chi nhánh & Ngày xem */}
                        <div className="mt-5 pt-4 border-t border-white/15 grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">
                            {/* Chọn chi nhánh */}
                            <div>
                                <label className="block text-xs font-bold text-blue-200 mb-1.5">
                                    Chi nhánh theo dõi:
                                </label>
                                {allowedBranch === 'all' ? (
                                    <div className="flex bg-black/20 p-1 rounded-xl gap-1">
                                        <button
                                            type="button"
                                            onClick={() => setCurrentBranch('all')}
                                            className={`flex-1 py-1.5 px-2 rounded-lg text-xs font-extrabold transition ${
                                                currentBranch === 'all'
                                                    ? 'bg-white text-blue-900 shadow-sm'
                                                    : 'text-white/80 hover:text-white'
                                            }`}
                                        >
                                            🏥 Cả 2 chi nhánh
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setCurrentBranch('nga-bay')}
                                            className={`flex-1 py-1.5 px-2 rounded-lg text-xs font-extrabold transition ${
                                                currentBranch === 'nga-bay'
                                                    ? 'bg-white text-blue-900 shadow-sm'
                                                    : 'text-white/80 hover:text-white'
                                            }`}

        // Helper so sánh và sắp xếp STT toa thuốc theo thứ tự tự nhiên (1, 2, 3... 10, 15, ...)
        function comparePrescriptionStt(a, b, asc = true) {
            const rawA = a && a.prescriptionNo ? String(a.prescriptionNo).trim() : '';
            const rawB = b && b.prescriptionNo ? String(b.prescriptionNo).trim() : '';

            if (!rawA && !rawB) return 0;
            if (!rawA) return 1;
            if (!rawB) return -1;

            const numA = parseFloat(rawA);
            const numB = parseFloat(rawB);
            const isNumA = !isNaN(numA) && /^\d+(\.\d+)?$/.test(rawA);
            const isNumB = !isNaN(numB) && /^\d+(\.\d+)?$/.test(rawB);

            let diff = 0;
            if (isNumA && isNumB) {
                diff = numA - numB;
            } else {
                diff = rawA.localeCompare(rawB, 'vi', { numeric: true, sensitivity: 'base' });
            }

            return asc ? diff : -diff;
        }

        // Unified Direct Prescription Input Section (Tiền khám bệnh - Nhập toa ở trên, lưu xuống danh sách phía dưới)
        function ExaminationSection({ 
            examinations = {}, 
            patientDetails = {}, 
            prescriptions: propPrescriptions = [], 
            onUpdateExaminations, 
            onChange, 
            onPatientDetailsChange, 
            readOnly = false, 
            customPrices = [], 
            saveCustomPrices, 
            selectedBranch, 
            selectedDate 
        }) {
            // Danh sách các toa khám đã lưu
            const [localPrescriptions, setLocalPrescriptions] = useState(() => {
                if (Array.isArray(propPrescriptions) && propPrescriptions.length > 0) {
                    return propPrescriptions;
                }
                return convertOldDataToPrescriptions(examinations, patientDetails);
            });

            // Trạng thái bật/tắt form nhập toa mới (mặc định ẩn, nhấn nút mới hiện)
            const [isAddingNew, setIsAddingNew] = useState(false);

            // State form nhập toa mới ở trên cùng
            const [newStt, setNewStt] = useState('');
            const [newName, setNewName] = useState('');
            const [newPrice, setNewPrice] = useState('');
            const [newPaymentMethod, setNewPaymentMethod] = useState('cash'); // 'cash' | 'transfer'

            // State chỉnh sửa toa trong danh sách
            const [editingRowId, setEditingRowId] = useState(null);
            const [editForm, setEditForm] = useState({ prescriptionNo: '', name: '', price: '', paymentMethod: 'cash' });

            // State tìm kiếm và lọc
            const [searchTerm, setSearchTerm] = useState('');
            const [paymentFilter, setPaymentFilter] = useState('all'); // 'all' | 'transfer' | 'cash' | 'zero'
            const [showSequenceModal, setShowSequenceModal] = useState(false);
            const [showPriceBreakdown, setShowPriceBreakdown] = useState(false);
            const [highlightedRowId, setHighlightedRowId] = useState(null);
            const [billToPrint, setBillToPrint] = useState(null);
            const [sortMode, setSortMode] = useState('stt_asc'); // 'stt_asc' (1->N) | 'stt_desc' (N->1) | 'entry' (mới nhập)
            const [sortSuccessMessage, setSortSuccessMessage] = useState('');

            // Đồng bộ dữ liệu mỗi khi props thay đổi từ Firebase
            useEffect(() => {
                if (Array.isArray(propPrescriptions) && propPrescriptions.length > 0) {
                    setLocalPrescriptions(propPrescriptions);
                } else if (examinations && Object.keys(examinations).length > 0) {
                    setLocalPrescriptions(convertOldDataToPrescriptions(examinations, patientDetails));
                } else {
                    setLocalPrescriptions([]);
                }
            }, [propPrescriptions, examinations, patientDetails]);

            // Cập nhật lên component cha (lưu đồng thời cả định dạng mới và cũ để bảo toàn tương thích 100%)
            const commitPrescriptions = (updatedList) => {
                setLocalPrescriptions(updatedList);
                const { examinations: newExams, patientDetails: newDetails } = convertPrescriptionsToOldFormat(updatedList);
                if (onUpdateExaminations) {
                    onUpdateExaminations({
                        examinations: newExams,
                        patientDetails: newDetails,
                        prescriptions: updatedList
                    });
                }
                if (onChange) onChange(newExams);
                if (onPatientDetailsChange) onPatientDetailsChange(newDetails);
            };

            // Lưu toa mới từ form phía trên xuống danh sách phía dưới (tùy chọn mở in bill ngay)
            const handleSaveNewPrescription = (e, shouldPrint = false) => {
                if (e && e.preventDefault) e.preventDefault();
                const trimmedStt = String(newStt || '').trim();
                const trimmedPrice = String(newPrice || '').trim();

                if (!trimmedStt && !trimmedPrice) {
                    alert('⚠️ Vui lòng nhập số toa và số tiền khám!');
                    const el = document.getElementById('new-rx-stt-input');
                    if (el) el.focus();
                    return;
                }

                if (trimmedPrice === '') {
                    alert('⚠️ Vui lòng nhập số tiền khám (k)!');
                    const el = document.getElementById('new-rx-price-input');
                    if (el) el.focus();
                    return;
                }

                const newRow = {
                    id: 'rx_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                    prescriptionNo: trimmedStt,
                    name: String(newName || '').trim(),
                    price: trimmedPrice,
                    paymentMethod: newPaymentMethod
                };

                // Đưa toa mới lên đầu danh sách phía dưới để nhân viên thấy ngay toa vừa lưu
                const updated = [newRow, ...localPrescriptions];
                commitPrescriptions(updated);

                // Reset form nhập và đóng lại form
                setNewStt('');
                setNewPrice('');
                setNewName('');
                setNewPaymentMethod('cash');
                setIsAddingNew(false);

                // Hiệu ứng highlight toa vừa lưu
                setHighlightedRowId(newRow.id);
                setTimeout(() => setHighlightedRowId(null), 2500);

                // Mở giao diện in bill nếu chọn Lưu & In
                if (shouldPrint) {
                    setBillToPrint({
                        prescriptionNo: newRow.prescriptionNo,
                        name: newRow.name,
                        price: newRow.price,
                        paymentMethod: newRow.paymentMethod,
                        branch: selectedBranch,
                        date: selectedDate
                    });
                }
            };

            // Bắt đầu sửa 1 toa trong danh sách
            const handleStartEdit = (row) => {
                setEditingRowId(row.id);
                setEditForm({
                    prescriptionNo: row.prescriptionNo || '',
                    name: row.name || '',
                    price: row.price !== '' ? row.price : '',
                    paymentMethod: row.paymentMethod || 'cash'
                });
            };

            // Lưu chỉnh sửa toa
            const handleSaveEdit = (id) => {
                const updated = localPrescriptions.map(r => {
                    if (r.id === id) {
                        return {
                            ...r,
                            prescriptionNo: String(editForm.prescriptionNo || '').trim(),
                            name: String(editForm.name || '').trim(),
                            price: String(editForm.price || '').trim(),
                            paymentMethod: editForm.paymentMethod
                        };
                    }
                    return r;
                });
                commitPrescriptions(updated);
                setEditingRowId(null);
            };

            // Hủy chỉnh sửa
            const handleCancelEdit = () => {
                setEditingRowId(null);
            };

            // Chỉnh sửa từng trường của toa (cho bảng desktop)
            const handleRowChange = (id, field, value) => {
                const updated = localPrescriptions.map(row => {
                    if (row.id === id) {
                        return { ...row, [field]: value };
                    }
                    return row;
                });
                commitPrescriptions(updated);
            };

            // Đổi hình thức thanh toán (Tiền mặt <-> Chuyển khoản) với 1 chạm
            const handleTogglePayment = (id) => {
                const updated = localPrescriptions.map(row => {
                    if (row.id === id) {
                        const next = row.paymentMethod === 'transfer' ? 'cash' : 'transfer';
                        return { ...row, paymentMethod: next };
                    }
                    return row;
                });
                commitPrescriptions(updated);
            };

            // Xóa 1 toa
            const handleRemoveRow = (id) => {
                const row = localPrescriptions.find(r => r.id === id);
                const sttText = row && row.prescriptionNo ? `toa #${row.prescriptionNo}` : 'dòng này';
                if (confirm(`Bạn có chắc muốn xóa ${sttText}?`)) {
                    const updated = localPrescriptions.filter(r => r.id !== id);
                    commitPrescriptions(updated);
                    if (editingRowId === id) setEditingRowId(null);
                }
            };

            // Chuyển nhanh đến toa từ modal kiểm tra STT
            const handleJumpToPrescription = (stt) => {
                const target = localPrescriptions.find(r => String(r.prescriptionNo).trim() === String(stt).trim());
                if (target) {
                    setHighlightedRowId(target.id);
                    setTimeout(() => {
                        const el = document.getElementById(`row-${target.id}`);
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);
                    setTimeout(() => setHighlightedRowId(null), 3000);
                }
            };

            // Sắp xếp và lưu toàn bộ danh sách toa theo STT tăng dần vào cơ sở dữ liệu
            const handleSortAndSaveByStt = () => {
                if (!localPrescriptions || localPrescriptions.length === 0) {
                    alert('Chưa có toa khám nào để sắp xếp!');
                    return;
                }
                const sorted = [...localPrescriptions].sort((a, b) => comparePrescriptionStt(a, b, true));
                commitPrescriptions(sorted);
                setSortMode('stt_asc');
                setSortSuccessMessage('Đã sắp xếp danh sách theo STT (1→N)!');
                setTimeout(() => setSortSuccessMessage(''), 3000);
            };

            // Mở form thêm toa mới
            const handleAddRow = (customStt = null) => {
                setIsAddingNew(true);
                if (customStt !== null) {
                    setNewStt(customStt.toString());
                    setTimeout(() => {
                        const el = document.getElementById('new-rx-price-input');
                        if (el) el.focus();
                    }, 50);
                } else {
                    setTimeout(() => {
                        const el = document.getElementById('new-rx-stt-input');
                        if (el) el.focus();
                    }, 50);
                }
            };

            // Thống kê tổng hợp thời gian thực
            const stats = useMemo(() => {
                let totalExam = 0;
                let totalCash = 0;
                let totalTransfer = 0;
                let casesCount = 0;
                let zeroCasesCount = 0;
                let transferCases = 0;
                let cashCases = 0;
                let maxStt = 0;
                const priceGroups = {};

                localPrescriptions.forEach(p => {
                    const hasPrice = p.price !== '' && p.price !== null && !isNaN(parseFloat(p.price));
                    const hasStt = p.prescriptionNo && String(p.prescriptionNo).trim() !== '';
                    const hasName = p.name && String(p.name).trim() !== '';

                    if (!hasPrice && !hasStt && !hasName) return;

                    casesCount++;
                    const priceNum = hasPrice ? parseFloat(p.price) : 0;
                    const isTransfer = p.paymentMethod === 'transfer';

                    if (isTransfer) transferCases++;
                    else cashCases++;

                    if (priceNum === 0) {
                        zeroCasesCount++;
                    } else {
                        totalExam += priceNum;
                        if (isTransfer) totalTransfer += priceNum;
                        else totalCash += priceNum;
                    }

                    if (/^\d+$/.test(String(p.prescriptionNo).trim())) {
                        const n = parseInt(p.prescriptionNo, 10);
                        if (n > maxStt) maxStt = n;
                    }

                    const pKey = priceNum.toString();
                    if (!priceGroups[pKey]) {
                        priceGroups[pKey] = { count: 0, cash: 0, transfer: 0, total: 0 };
                    }
                    priceGroups[pKey].count++;
                    priceGroups[pKey].total += priceNum;
                    if (isTransfer) priceGroups[pKey].transfer++;
                    else priceGroups[pKey].cash++;
                });

                const sortedGroups = Object.entries(priceGroups).sort((a, b) => parseFloat(a[0]) - parseFloat(b[0]));

                return {
                    totalExam,
                    totalCash,
                    totalTransfer,
                    casesCount,
                    zeroCasesCount,
                    transferCases,
                    cashCases,
                    maxStt,
                    sortedGroups
                };
            }, [localPrescriptions]);

            // Phân tích dãy STT toa thuốc
            const currentPatientDetails = useMemo(() => {
                const { patientDetails: pd } = convertPrescriptionsToOldFormat(localPrescriptions);
                return pd;
            }, [localPrescriptions]);

            const sequenceInfo = useMemo(() => {
                return getSequenceAnalysis(currentPatientDetails, true);
            }, [currentPatientDetails]);

            // Phát hiện trùng STT toa trong danh sách
            const duplicateSttSet = useMemo(() => {
                const counts = {};
                localPrescriptions.forEach(p => {
                    const raw = p.prescriptionNo ? String(p.prescriptionNo).trim() : '';
                    if (raw) counts[raw] = (counts[raw] || 0) + 1;
                });
                const dups = new Set();
                Object.entries(counts).forEach(([stt, cnt]) => {
                    if (cnt > 1) dups.add(stt);
                });
                return dups;
            }, [localPrescriptions]);

            // Kiểm tra xem STT đang gõ ở form trên có trùng với toa đã có không
            const isNewSttDup = useMemo(() => {
                const raw = String(newStt || '').trim();
                if (!raw) return false;
                return localPrescriptions.some(p => String(p.prescriptionNo || '').trim() === raw);
            }, [newStt, localPrescriptions]);

            // Danh sách sau khi lọc, tìm kiếm và sắp xếp
            const filteredPrescriptions = useMemo(() => {
                let list = localPrescriptions.filter(p => {
                    if (paymentFilter === 'transfer' && p.paymentMethod !== 'transfer') return false;
                    if (paymentFilter === 'cash' && p.paymentMethod === 'transfer') return false;
                    if (paymentFilter === 'zero') {
                        const pr = parseFloat(p.price);
                        if (pr !== 0 && p.price !== '0') return false;
                    }

                    if (searchTerm.trim()) {
                        const term = searchTerm.trim().toLowerCase();
                        const sttMatch = p.prescriptionNo && String(p.prescriptionNo).toLowerCase().includes(term);
                        const nameMatch = p.name && String(p.name).toLowerCase().includes(term);
                        const priceMatch = p.price !== '' && String(p.price).includes(term);
                        if (!sttMatch && !nameMatch && !priceMatch) return false;
                    }

                    return true;
                });

                if (sortMode === 'stt_asc') {
                    list.sort((a, b) => comparePrescriptionStt(a, b, true));
                } else if (sortMode === 'stt_desc') {
                    list.sort((a, b) => comparePrescriptionStt(a, b, false));
                }

                return list;
            }, [localPrescriptions, paymentFilter, searchTerm, sortMode]);

            return (
                <div className="bg-white rounded-2xl shadow-md p-3 sm:p-5 border border-gray-100">
                    {/* Header Toolbar */}
                    <div className="flex items-center justify-between gap-2 pb-2.5 border-b border-gray-200 flex-wrap">
                        <div className="flex items-center gap-2 flex-wrap">
                            <h2 className="text-base sm:text-xl font-black text-gray-800 tracking-tight flex items-center gap-1.5">
                                <span>💰</span> Tiền khám bệnh
                            </h2>
                            <button

        function MedicineSection({ medicines, medicineList, onChange, readOnly = false }) {
            const [showSuggestions, setShowSuggestions] = useState({});
            const [showMedicineSelect, setShowMedicineSelect] = useState(false);

            const addMedicine = () => {
                onChange([...medicines, { name: '', quantity: '', price: '' }]);
            };

            const addFromList = (medicine) => {
                const existing = medicines.find(m => m.name.toLowerCase() === medicine.name.toLowerCase());
                if (existing) {
                    alert('Thuốc này đã có trong danh sách!');
                    return;
                }
                onChange([...medicines, { name: medicine.name, quantity: '', price: medicine.price }]);
                setShowMedicineSelect(false);
            };

            const removeMedicine = (index) => {
                onChange(medicines.filter((_, i) => i !== index));
            };

            const updateMedicine = (index, field, value) => {
                const updated = [...medicines];
                updated[index][field] = value;
                
                // Auto-fill price when selecting from suggestions
                if (field === 'name') {
                    const matchedMedicine = medicineList.find(m => m.name.toLowerCase() === value.toLowerCase());
                    if (matchedMedicine && !updated[index].price) {
                        updated[index].price = matchedMedicine.price;
                    }
                }
                
                onChange(updated);
            };

            const selectMedicine = (index, medicine) => {
                const updated = [...medicines];
                updated[index].name = medicine.name;
                updated[index].price = medicine.price;
                onChange(updated);
                setShowSuggestions({ ...showSuggestions, [index]: false });
            };

            const getSuggestions = (index, searchTerm) => {
                if (!searchTerm || searchTerm.length < 2) return [];
                return medicineList.filter(med => 
                    med.name.toLowerCase().includes(searchTerm.toLowerCase())
                ).slice(0, 10);
            };

            const totalMedicine = medicines.reduce((sum, med) => {
                return sum + (parseFloat(med.quantity || 0) * parseFloat(med.price || 0));
            }, 0);
