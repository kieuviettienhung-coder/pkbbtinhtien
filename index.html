        const buildDailyReport = (dateStr, branchesData) => {
            const d = dateStr.split('-');
            let msg = '📊 *BÁO CÁO DOANH THU*\n';
            msg += `📅 Ngày: *${d[2]}/${d[1]}/${d[0]}*\n`;
            msg += '━━━━━━━━━━━━━━━━━━━━\n';

            let gExam = 0, gDoctor = 0, gExpense = 0, gMedicine = 0, gCases = 0, gNet = 0;
            let hasData = false;

            // Find Nga Bay's medicine total first so it can be added to Thot Not
            let ngaBayMedicine = 0;
            const nbBranch = branchesData.find(b => (b.key === 'nga-bay') || (b.name && b.name.includes('Ngã Bảy')));
            if (nbBranch && nbBranch.data && Array.isArray(nbBranch.data.medicines)) {
                nbBranch.data.medicines.forEach(m => {
                    ngaBayMedicine += parseFloat(m.quantity || 0) * parseFloat(m.price || 0);
                });
            }

            for (const { key, name, data } of branchesData) {
                if (!data || !data.examinations) {
                    msg += `\n${name}: 📭 Chưa có dữ liệu\n`;
                    continue;
                }
                hasData = true;
                let exam = 0, cases = 0, doctor = 0, expense = 0, medicine = 0;

                let examTransfer = 0;
                Object.entries(data.examinations || {}).forEach(([p, c]) => {
                    if (c && parseFloat(c) > 0) { exam += parseFloat(p) * parseFloat(c); cases += parseInt(c); }
                });
                if (data.patientDetails) {
                    Object.entries(data.patientDetails).forEach(([p, patients]) => {
                        if (Array.isArray(patients)) {
                            patients.forEach(pt => {
                                if (pt && pt.paymentMethod === 'transfer') {
                                    examTransfer += parseFloat(p || 0);
                                }
                            });
                        }
                    });
                }
                const examCash = exam - examTransfer;

                if (Array.isArray(data.doctorFees)) data.doctorFees.forEach(f => doctor += parseFloat(f.amount || 0));
                if (Array.isArray(data.expenses)) data.expenses.forEach(e => expense += parseFloat(e.amount || 0));
                if (Array.isArray(data.medicines)) data.medicines.forEach(m => medicine += parseFloat(m.quantity || 0) * parseFloat(m.price || 0));

                const isThotNot = (key === 'thot-not') || (name && name.includes('Thốt Nốt'));
                const isNgaBay = (key === 'nga-bay') || (name && name.includes('Ngã Bảy'));

                const transferredFromNB = isThotNot ? ngaBayMedicine : 0;
                const net = (exam - doctor - expense - medicine) + transferredFromNB;
                const fmt = n => (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('vi-VN') + 'k';

                msg += `\n${name}\n`;
                if (examTransfer > 0) {
                    msg += `💰 Tiền khám: ${fmt(exam)} (${cases} ca - 💵 TM: ${fmt(examCash)}, 💳 CK: ${fmt(examTransfer)})\n`;
                } else {
                    msg += `💰 Tiền khám: ${fmt(exam)} (${cases} ca)\n`;
                }
                msg += `👨‍⚕️ Lương BS: ${fmt(doctor)}\n`;
                msg += `💸 Chi phí: ${fmt(expense)}\n`;
                if (isNgaBay) {
                    msg += `💊 Tiền thuốc (chuyển về Thốt Nốt): ${fmt(medicine)}\n`;
                } else {
                    msg += `💊 Tiền thuốc tại quầy: ${fmt(medicine)}\n`;
                }
                if (isThotNot && transferredFromNB > 0) {
                    msg += `📦 Thuốc nhận từ Ngã Bảy: +${fmt(transferredFromNB)}\n`;
                }
                msg += `${net >= 0 ? '✅' : '🔴'} Còn lại: *${fmt(net)}*\n`;

                if (data.patientDetails) {
                    let detailMsgs = [];
                    Object.entries(data.patientDetails).forEach(([price, patients]) => {
                        if (Array.isArray(patients) && patients.length > 0) {
                            const validPatients = patients.filter(p => p.name || p.prescriptionNo);
                            if (validPatients.length > 0) {
                                detailMsgs.push(`[${price}k]: ` + validPatients.map(p => `${p.name} (Toa ${p.prescriptionNo}${p.paymentMethod === 'transfer' ? ' - CK' : ''})`).join(', '));
                            }
                        }
                    });
                    if (detailMsgs.length) {
                        msg += `   ┗ Bệnh nhân: ${detailMsgs.join('; ')}\n`;
                    }
                }

                if (Array.isArray(data.doctorFees) && data.doctorFees.length > 0) {
                    const details = data.doctorFees.filter(f => f.doctor && parseFloat(f.amount) > 0).map(f => `${f.doctor} ${fmt(parseFloat(f.amount))}`);
                    if (details.length) msg += `   ┗ ${details.join(', ')}\n`;
                }
                if (Array.isArray(data.expenses) && data.expenses.length > 0) {
                    const details = data.expenses.filter(e => e.description && parseFloat(e.amount) > 0).map(e => `${e.description} ${fmt(parseFloat(e.amount))}`);
                    if (details.length) msg += `   ┗ ${details.join(', ')}\n`;
                }

                gExam += exam; gDoctor += doctor; gExpense += expense; gMedicine += medicine; gCases += cases;
                gNet += net;
            }

            if (hasData && branchesData.length > 1) {
                const fmt = n => (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('vi-VN') + 'k';
                msg += '\n━━━━━━━━━━━━━━━━━━━━\n';
                msg += '📈 *TỔNG 2 CHI NHÁNH*\n';
                msg += `💰 Tiền khám: *${fmt(gExam)}* (${gCases} ca)\n`;
                msg += `👨‍⚕️ Lương BS: ${fmt(gDoctor)}\n`;
                msg += `💸 Chi phí: ${fmt(gExpense)}\n`;
                msg += `💊 Tiền thuốc: ${fmt(gMedicine)}\n`;
                msg += `${gNet >= 0 ? '✅' : '🔴'} *Còn lại: ${fmt(gNet)}*\n`;
            }

            const now = new Date();
            const pad = n => n.toString().padStart(2, '0');
            msg += `\n🕗 ${pad(now.getHours())}:${pad(now.getMinutes())} ${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
            return msg;
        };

        // Default price levels
        const DEFAULT_PRICE_LEVELS = [0, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 160, 170, 180, 190, 200, 220, 230, 260, 280, 300, 320];

        function App() {

            const [dailyData, setDailyData] = useState({

            const [medicineList, setMedicineList] = useState([

            // Load passwords from Firebase on mount
            useEffect(() => {

            const changePassword = async () => {
                let passwordType = 'admin';
                let currentPassword = adminPassword;
                let dbPath = 'settings_v2/adminPassword';
                let setPasswordFunc = setAdminPassword;
                
                if (userRole === 'staff') {
                    if (allowedBranch === 'nga-bay') {

                if (currentPass !== currentPassword) {

                try {

                }
            };

            const managePasswords = async () => {
                if (userRole !== 'admin') {
                    alert('❌ Chỉ Admin mới có quyền quản lý tài khoản!');
                    return;
                }

                const accounts = [
                    { name: '👨‍💼 Admin (Toàn quyền)', role: 'admin', path: 'passwords_v2/admin', currentPass: adminPassword, setter: setAdminPassword },
                    { name: '👨‍💼 Admin Ngã Bảy', role: 'admin-nga-bay', path: 'passwords_v2/admin-nga-bay', currentPass: adminNgaBayPassword, setter: setAdminNgaBayPassword },
                    { name: '👨‍💻 Nhân viên Ngã Bảy', role: 'nga-bay', path: 'passwords_v2/nga-bay', currentPass: ngaBayPassword, setter: setNgaBayPassword },
                    { name: '👨‍💻 Nhân viên Thốt Nốt', role: 'thot-not', path: 'passwords_v2/thot-not', currentPass: thotNotPassword, setter: setThotNotPassword }
                ];

                let message = '👥 QUẢN LÝ TÀI KHOẢN\n\n';
                message += 'Chọn tài khoản cần đổi mật khẩu:\n\n';
                accounts.forEach((acc, i) => {
                    message += `${i + 1}. ${acc.name}\n`;
                });
                message += '\nNhập số (1-4) hoặc 0 để hủy:';

                const choice = prompt(message);
                if (!choice || choice === '0') return;

                const index = parseInt(choice) - 1;
                if (index < 0 || index >= accounts.length) {
                    alert('❌ Lựa chọn không hợp lệ!');
                    return;
                }

                const account = accounts[index];
                
                const newPass = prompt(`🔐 Đổi mật khẩu cho: ${account.name}\n\nNhập mật khẩu mới:`);
                if (!newPass) return;
                
                if (newPass.length < 4) {
                    alert('❌ Mật khẩu phải có ít nhất 4 ký tự!');
                    return;
                }
                
                const confirmPass = prompt('Nhập lại mật khẩu mới để xác nhận:');
                if (!confirmPass) return;
                
                if (newPass !== confirmPass) {
                    alert('❌ Mật khẩu xác nhận không khớp!');
                    return;
                }
                
                try {
                    await db.ref(account.path).set(newPass);
                    account.setter(newPass);
                    alert(`✅ Đã đổi mật khẩu thành công cho: ${account.name}`);
                } catch (error) {
                    console.error('Error changing password:', error);
                    alert('❌ Lỗi khi đổi mật khẩu: ' + error.message);
                }
            };

            // Load data when date/branch changes
            useEffect(() => {
                if (user) {
                    const cleanupDaily = loadDailyData();
                    loadCustomPrices();
                    return () => {
                        if (cleanupDaily) cleanupDaily();
                    };
                }
            }, [selectedBranch, selectedDate, user]);

            // Reload report data when branch changes
            useEffect(() => {
                if (user && userRole === 'admin') {
                    if (currentView === 'report') {
                        loadMonthlyData();
                    } else if (currentView === 'yearly') {
                        loadYearlyData();
                    }
                }
            }, [selectedBranch, selectedDate, currentView]);

            const loadCustomPrices = () => {
                db.ref(`settings_v2/customPrices/${selectedBranch}`).once('value', (snapshot) => {
                    const prices = snapshot.val() || [];
                    setCustomPrices(prices);
                });
            };

            const saveCustomPrices = (prices) => {
                db.ref(`settings_v2/customPrices/${selectedBranch}`).set(prices);
                setCustomPrices(prices);
            };

            const loadDailyData = () => {
                const dateKey = selectedDate.replace(/-/g, '');
                const dataRef = db.ref(`daily_v2/${selectedBranch}/${dateKey}`);
                
                dataRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        setDailyData(data);
                    } else {
                        setDailyData({
                            examinations: {},
                            patientDetails: {},
                            expenses: [],
                            doctorFees: [],
                            medicines: []
                        });
                    }
                });

                let nbRef = null;
                if (selectedBranch === 'thot-not') {
                    nbRef = db.ref(`daily_v2/nga-bay/${dateKey}/medicines`);
                    nbRef.on('value', (snapshot) => {
                        const meds = snapshot.val() || [];
                        let total = 0;
                        if (Array.isArray(meds)) {
                            meds.forEach(m => {
                                total += parseFloat(m.quantity || 0) * parseFloat(m.price || 0);
                            });
                        }
                        setNgaBayDailyMedicineTotal(total);
                    });
                } else {
                    setNgaBayDailyMedicineTotal(0);
                }

                return () => {
                    dataRef.off();
                    if (nbRef) nbRef.off();
                };
            };

            const loadMonthlyData = () => {
                const year = selectedDate.substring(0, 4);
                const month = selectedDate.substring(5, 7);
                const monthKey = year + month;
                
                const dataRef = db.ref(`daily_v2/${selectedBranch}`);
                dataRef.orderByKey().startAt(monthKey + '01').endAt(monthKey + '31').once('value', (snapshot) => {
                    const data = {};
                    snapshot.forEach((child) => {
                        data[child.key] = child.val();
                    });
                    setMonthlyData(data);
                });

                if (selectedBranch === 'thot-not') {
                    const nbRef = db.ref(`daily_v2/nga-bay`);

                        });

                const dataRef = db.ref(`daily_v2/${selectedBranch}`);

                medicineRef.once('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {

        // Yearly Report View Component
        function YearlyReportView({ selectedBranch, selectedDate, yearlyData, ngaBayYearlyData = {} }) {
            const year = selectedDate.substring(0, 4);

            // Group data by month
            const monthlyGroups = {};
            for (let month = 1; month <= 12; month++) {
                const monthKey = month.toString().padStart(2, '0');
                monthlyGroups[monthKey] = [];
            }

            Object.entries(yearlyData).forEach(([dateKey, dayData]) => {
                const month = dateKey.substring(4, 6);
                if (monthlyGroups[month]) {
                    monthlyGroups[month].push(dayData);
                }
            });

            const calculateMonthTotals = (monthKey, monthData) => {
                let examTotal = 0, doctorTotal = 0, expenseTotal = 0, medicineTotal = 0, totalCases = 0, zeroCases = 0;

                monthData.forEach(dayData => {
                    examTotal += Object.entries(dayData.examinations || {})
                        .filter(([price, count]) => count && parseFloat(count) > 0)
                        .reduce((sum, [price, count]) => {
                            return sum + (parseFloat(price) * parseFloat(count));
                        }, 0);

                    doctorTotal += (dayData.doctorFees || []).reduce((sum, fee) => {
                        return sum + parseFloat(fee.amount || 0);
                    }, 0);

                    expenseTotal += (dayData.expenses || []).reduce((sum, exp) => {
                        return sum + parseFloat(exp.amount || 0);
                    }, 0);

                    medicineTotal += (dayData.medicines || []).reduce((sum, med) => {
                        return sum + (parseFloat(med.quantity || 0) * parseFloat(med.price || 0));
                    }, 0);

                    totalCases += Object.entries(dayData.examinations || {})
                        .filter(([price, count]) => count && parseFloat(count) > 0)
                        .reduce((sum, [price, count]) => {
                            return sum + parseInt(count);
                        }, 0);
                    
                    // Đếm số ca 0 đồng
                    zeroCases += parseInt(dayData.examinations?.['0'] || 0);
                });

                // Transferred medicine from Nga Bay for this month (when viewing Thot Not)
                let transferredMedicine = 0;
                if (selectedBranch === 'thot-not') {
                    Object.entries(ngaBayYearlyData).forEach(([dKey, nbDay]) => {
                        if (dKey.substring(4, 6) === monthKey && Array.isArray(nbDay.medicines)) {
                            transferredMedicine += nbDay.medicines.reduce((sum, m) => sum + (parseFloat(m.quantity || 0) * parseFloat(m.price || 0)), 0);
                        }
                    });
                }

                return {
                    examTotal,
                    doctorTotal,
                    expenseTotal,
                    medicineTotal,
                    transferredMedicine,
                    totalCases,
                    zeroCases,
                    netTotal: (examTotal - doctorTotal - expenseTotal - medicineTotal) + transferredMedicine
                };
            };

            const monthlyTotals = Object.entries(monthlyGroups).map(([month, data]) => ({
                month,
                ...calculateMonthTotals(month, data)
            }));

            const yearTotal = monthlyTotals.reduce((acc, month) => ({
                examTotal: acc.examTotal + month.examTotal,
                doctorTotal: acc.doctorTotal + month.doctorTotal,
                expenseTotal: acc.expenseTotal + month.expenseTotal,
                medicineTotal: acc.medicineTotal + month.medicineTotal,
                transferredMedicine: acc.transferredMedicine + month.transferredMedicine,
                totalCases: acc.totalCases + month.totalCases,
                zeroCases: acc.zeroCases + month.zeroCases,
                netTotal: acc.netTotal + month.netTotal
            }), { examTotal: 0, doctorTotal: 0, expenseTotal: 0, medicineTotal: 0, transferredMedicine: 0, totalCases: 0, zeroCases: 0, netTotal: 0 });

            const exportYearlyToExcel = () => {
                const wb = XLSX.utils.book_new();
                const isThotNot = selectedBranch === 'thot-not';

        // Helper to analyze prescription sequence (detect missing / jumped numbers)
        function getSequenceAnalysis(patientDetails, checkFromOne = true) {
            const list = [];
            const duplicates = [];
            const seen = new Map();

            Object.entries(patientDetails || {}).forEach(([price, patients]) => {
                if (Array.isArray(patients)) {
                    patients.forEach((p) => {
                        const raw = p && p.prescriptionNo ? String(p.prescriptionNo).trim() : '';
                        if (raw) {
                            const isNum = /^\d+$/.test(raw);
                            const num = isNum ? parseInt(raw, 10) : null;
                            const item = {
                                price,
                                name: p && p.name ? String(p.name).trim() : 'Chưa có tên',
                                paymentMethod: p && p.paymentMethod === 'transfer' ? 'transfer' : 'cash',
                                rawStt: raw,
                                num,
                                isNum
                            };
                            list.push(item);

                            const key = raw.toLowerCase();
                            if (seen.has(key)) {
                                duplicates.push({ stt: raw, current: item, previous: seen.get(key) });
                            } else {
                                seen.set(key, item);
                            }
                        }
                    });
                }
            });

            const numericItems = list.filter(item => item.isNum);
            const nonNumericItems = list.filter(item => !item.isNum);

            if (numericItems.length === 0) {
                return {
                    total: list.length,
                    numericCount: 0,
                    hasJumps: false,
                    missingNumbers: [],
                    min: null,
                    max: null,
                    items: list,
                    numericItems: [],
                    nonNumericItems,
                    duplicates,
                    sequenceList: []
                };
            }

            const numbers = numericItems.map(item => item.num);
            const min = Math.min(...numbers);
            const max = Math.max(...numbers);

            const mapByNum = new Map();
            numericItems.forEach(item => {
                if (!mapByNum.has(item.num)) {
                    mapByNum.set(item.num, []);
                }
                mapByNum.get(item.num).push(item);
            });

            const startNum = checkFromOne ? 1 : min;
            const missingNumbers = [];
            const sequenceList = [];

            for (let i = startNum; i <= max; i++) {
                if (mapByNum.has(i)) {
                    sequenceList.push({
                        num: i,
                        status: 'present',
                        patients: mapByNum.get(i)
                    });
                } else {
                    missingNumbers.push(i);
                    sequenceList.push({
                        num: i,
                        status: 'missing',
                        patients: []
                    });
                }
            }

            return {
                total: list.length,
                numericCount: numericItems.length,
                hasJumps: missingNumbers.length > 0,
                missingNumbers,
                min,
                max,
                items: list,
                numericItems,
                nonNumericItems,
                duplicates,
                sequenceList
            };
        }

        // Modal inspecting prescription sequence numbers and jumps

                return getSequenceAnalysis(patientDetails, checkFromOne);
            }, [patientDetails, checkFromOne]);

            const {
                numericCount,
                hasJumps,
                missingNumbers,
                min,
                max,
                nonNumericItems,
                sequenceList
            } = analysis;

            const filteredList = useMemo(() => {
                return sequenceList.filter(item => {
                    if (filterType === 'missing' && item.status !== 'missing') return false;
                    if (filterType === 'present' && item.status !== 'present') return false;

                    if (priceFilter !== 'all') {
                        if (item.status === 'missing') return false;
                        const matchPrice = item.patients.some(p => p.price.toString() === priceFilter.toString());

                        const matchName = item.patients.some(p => p.name.toLowerCase().includes(term));

                                                onClick={() => setFilterType('missing')}

                                            >

                                            </button>
                                            <button
                                                onClick={() => setFilterType('present')}
                                                className={`flex-1 sm:flex-none px-3 py-1.5 rounded-lg transition ${

                                        <div className="flex gap-2">

                                                value={searchTerm}
                                                onChange={e => setSearchTerm(e.target.value)}

                                                        >
                                                            <div className="flex items-center gap-2.5">
                                                                <span className="bg-red-600 text-white text-xs font-black px-2.5 py-1 rounded-lg shadow-sm min-w-[65px] text-center">
                                                                    Toa #{item.num}
                                                                </span>
                                                                <span className="font-bold text-xs sm:text-sm text-red-700">

                                                                Thiếu

                                                        </div>

                                                return (
                                                    <div 
                                                        key={item.num}
                                                        className="flex items-center justify-between p-2.5 sm:p-3 rounded-xl border border-gray-200 bg-white hover:bg-blue-50/50 transition shadow-sm"
                                                    >
                                                        <div className="flex items-center gap-2.5 sm:gap-3 flex-1 min-w-0">
                                                            <span className="bg-blue-600 text-white text-xs font-black px-2.5 py-1 rounded-lg min-w-[65px] text-center shadow-sm">
                                                                Toa #{item.num}
                                                            </span>
                                                            <div className="flex-1 min-w-0">
                                                                <p className="font-bold text-gray-800 text-xs sm:text-sm truncate">
                                                                    {item.patients.map(p => p.name || 'Chưa có tên').join(' • ')}
                                                                </p>
                                                                <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">

                                                                            <span 
                                                                                className="text-[11px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-md"
                                                                            >
                                                                                Giá: {p.price}k
                                                                            </span>
                                                                            {p.paymentMethod === 'transfer' ? (
                                                                                <span className="text-[11px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded-md flex items-center gap-1">
                                                                                    💳 Chuyển khoản
                                                                                </span>
                                                                            ) : (
                                                                                <span className="text-[11px] bg-gray-100 text-gray-600 font-medium px-2 py-0.5 rounded-md">
                                                                                    💵 Tiền mặt
                                                                                </span>
                                                                            )}
                                                                        </React.Fragment>
                                                                    ))}
                                                                    {item.patients.length > 1 && (
                                                                        <span className="text-[11px] bg-red-100 text-red-600 font-extrabold px-2 py-0.5 rounded-md">

                            </button>

                </div>
            );
        }

        // Examination Section with Add Custom Price
        function ExaminationSection({ examinations, patientDetails = {}, onChange, onPatientDetailsChange, readOnly = false, customPrices = [], saveCustomPrices, selectedBranch, selectedDate }) {
            const [priceLevels, setPriceLevels] = useState([]);
            const [newPrice, setNewPrice] = useState('');
            const [activeModalPrice, setActiveModalPrice] = useState(null);
            const [showSequenceModal, setShowSequenceModal] = useState(false);

            // Rebuild price levels when examinations or customPrices change
            useEffect(() => {
                const existingPrices = Object.keys(examinations).map(p => parseFloat(p));
                const allPrices = [...new Set([...DEFAULT_PRICE_LEVELS, ...customPrices, ...existingPrices])];
                setPriceLevels(allPrices.sort((a, b) => a - b));
            }, [examinations, customPrices]);

            // Real-time analysis of prescription sequence across all price levels
            const sequenceInfo = useMemo(() => {
                return getSequenceAnalysis(patientDetails, true);
            }, [patientDetails]);

            const addCustomPrice = () => {
                const price = parseFloat(newPrice);
                if (price && price > 0 && !customPrices.includes(price) && !DEFAULT_PRICE_LEVELS.includes(price)) {
                    const updated = [...customPrices, price].sort((a, b) => a - b);
                    saveCustomPrices(updated);
                    setNewPrice('');
                }
            };

            const removePrice = (price) => {
                if (confirm(`Xóa mức giá ${price}k?`)) {
                    // Remove from custom prices
                    const updatedCustom = customPrices.filter(p => p !== price);
                    saveCustomPrices(updatedCustom);
                    
                    // Remove from examinations
                    const updated = {...examinations};
                    delete updated[price];
                    onChange(updated);
                }
            };

            return (
                <div className="bg-white rounded-lg shadow-md p-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                        <div className="flex items-center gap-2 flex-wrap">
                            <h2 className="text-xl font-bold text-gray-800">💰 Tiền khám bệnh</h2>
                            <button
                                onClick={() => setShowSequenceModal(true)}
                                className={`text-xs px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition shadow-sm ${
                                    sequenceInfo.hasJumps 
                                        ? 'bg-amber-100 text-amber-900 border border-amber-300 hover:bg-amber-200 animate-pulse' 
                                        : sequenceInfo.numericCount > 0 
                                            ? 'bg-emerald-100 text-emerald-800 border border-emerald-300 hover:bg-emerald-200' 
                                            : 'bg-gray-100 text-gray-600 border border-gray-200 hover:bg-gray-200'
                                }`}
                                title="Kiểm tra xem số thứ tự toa thuốc có bị nhảy không"
                            >
                                <span>{sequenceInfo.hasJumps ? '⚠️' : sequenceInfo.numericCount > 0 ? '✅' : '🔍'}</span>
                                <span>
                                    {sequenceInfo.hasJumps 
                                        ? `Nhảy ${sequenceInfo.missingNumbers.length} số toa` 
                                        : sequenceInfo.numericCount > 0 
                                            ? `STT liên tục (${sequenceInfo.numericCount} toa)` 
                                            : 'Kiểm tra STT toa'}
                                </span>
                            </button>
                        </div>
                        {!readOnly && (
                            <div className="flex gap-2 w-full sm:w-auto">
                                <input
                                    type="number"
                                    value={newPrice}
                                    onChange={(e) => setNewPrice(e.target.value)}
                                    placeholder="Giá mới (k)"
                                    className="w-32 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    onKeyPress={(e) => e.key === 'Enter' && addCustomPrice()}
                                />
                                <button
                                    onClick={addCustomPrice}
                                    className="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition font-semibold"
                                >
                                    ➕ Thêm giá
                                </button>
                            </div>
                        )}
                    </div>
                    
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                        {priceLevels.map(price => {
                            const validPatientsCount = (patientDetails[price] || []).filter(p => (p.name && p.name.trim()) || (p.prescriptionNo && p.prescriptionNo.trim())).length;
                            const inputCount = parseInt(examinations?.[price] || 0);
                            const isMismatch = validPatientsCount !== inputCount;

                            return (
                                <div key={price} className="relative">
                                    <div className="flex flex-col gap-1">
                                        <div className="flex justify-between items-center">
                                            <label className="text-xs font-semibold text-gray-600">
                                                {price}k
                                            </label>
                                            <div className="flex gap-1">
                                                <button 
                                                    onClick={() => setActiveModalPrice(price)}
                                                    className="text-blue-500 hover:text-blue-700 text-xs px-1"
                                                    title="Nhập thông tin toa"
                                                >
                                                    📝
                                                </button>
                                                {!DEFAULT_PRICE_LEVELS.includes(price) && customPrices.includes(price) && !readOnly && (
                                                    <button
                                                        onClick={() => removePrice(price)}
                                                        className="text-red-500 hover:text-red-700 text-xs px-1"
                                                        title="Xóa mức giá này"
                                                    >
                                                        ✕
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                        <input
                                            type="number"
                                            min="0"
                                            value={examinations?.[price] || ''}
                                            onChange={(e) => {
                                                onChange({
                                                    ...examinations,
                                                    [price]: e.target.value
                                                });
                                            }}
                                            disabled={readOnly}
                                            className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:border-transparent text-center text-lg font-semibold ${
                                                isMismatch 
                                                    ? 'border-red-500 bg-red-50 text-red-600 focus:ring-red-500' 
                                                    : 'border-gray-300 focus:ring-blue-500'
                                            } ${readOnly ? 'bg-gray-100 cursor-not-allowed border-gray-300' : ''}`}
                                            placeholder="0"
                                        />
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    
                    <div className="mt-4 p-4 bg-blue-50 rounded-lg">
                        <div className="flex justify-between items-center mb-2">
                            <p className="text-lg font-bold text-blue-800">
                                Tổng tiền khám: {Object.entries(examinations || {})
                                    .filter(([price, count]) => count && parseFloat(count) > 0)
                                    .reduce((sum, [price, count]) => {
                                        return sum + (parseFloat(price) * parseFloat(count));
                                    }, 0).toLocaleString()}k
                            </p>
                        </div>
                        {(() => {
                            let transferCount = 0;
                            let transferAmount = 0;
                            Object.entries(patientDetails || {}).forEach(([p, patients]) => {
                                if (Array.isArray(patients)) {
                                    patients.forEach(pt => {
                                        if (pt && pt.paymentMethod === 'transfer') {
                                            transferCount += 1;
                                            transferAmount += parseFloat(p || 0);
                                        }
                                    });
                                }
                            });
                            if (transferCount > 0) {
                                return (
                                    <div className="flex justify-between items-center text-xs font-semibold text-purple-700 bg-purple-50 px-2.5 py-1.5 rounded-md mb-2 border border-purple-200">
                                        <span>💳 Trong đó Chuyển khoản ({transferCount} toa):</span>
                                        <span className="font-bold text-sm">+{transferAmount.toLocaleString()}k</span>
                                    </div>
                                );
                            }
                            return null;
                        })()}
                        <div className="flex justify-between items-center">
                            <p className="text-sm font-semibold text-blue-700">
                                Tổng số ca:
                            </p>
                            <p className="text-lg font-bold text-blue-600">
                                {Object.entries(examinations || {})
                                    .filter(([price, count]) => count && parseFloat(count) > 0)
                                    .reduce((sum, [price, count]) => {
                                        return sum + parseInt(count);
                                    }, 0)} ca
                            </p>
                        </div>
                        {/* Debug: Chi tiết tính toán */}
                        <details className="mt-3">
                            <summary className="text-xs text-blue-600 cursor-pointer hover:text-blue-800">
                                🔍 Xem chi tiết tính toán
                            </summary>
                            <div className="mt-2 text-xs bg-white p-2 rounded border border-blue-200 max-h-40 overflow-y-auto">
                                {Object.entries(examinations || {})
                                    .filter(([price, count]) => count && parseFloat(count) > 0)
                                    .sort((a, b) => parseFloat(a[0]) - parseFloat(b[0]))
                                    .map(([price, count]) => (
                                        <div key={price} className="flex justify-between py-1 border-b border-gray-100">
                                            <span>{price}k × {count} ca</span>
                                            <span className="font-semibold text-green-600">
                                                = {(parseFloat(price) * parseFloat(count)).toLocaleString()}k
                                            </span>
                                        </div>
                                    ))
                                }
                                <div className="flex justify-between py-2 mt-2 border-t-2 border-blue-300 font-bold">
                                    <span>TỔNG</span>
                                    <span className="text-blue-700">
                                        = {Object.entries(examinations || {})
                                            .filter(([price, count]) => count && parseFloat(count) > 0)
                                            .reduce((sum, [price, count]) => {
                                                return sum + (parseFloat(price) * parseFloat(count));
                                            }, 0).toLocaleString()}k
                                    </span>
                                </div>
                            </div>
                        </details>
                    </div>

                    {/* Prescription Sequence Check Banner */}
                    <div className={`mt-3 p-4 rounded-xl border transition shadow-sm ${
                        sequenceInfo.hasJumps 
                            ? 'bg-amber-50/90 border-amber-300' 
                            : sequenceInfo.numericCount > 0 
                                ? 'bg-emerald-50/90 border-emerald-300' 
                                : 'bg-gray-50 border-gray-200'
                    }`}>
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div className="flex items-start gap-3">
                                <span className="text-2xl mt-0.5">
                                    {sequenceInfo.hasJumps ? '⚠️' : sequenceInfo.numericCount > 0 ? '✅' : '📋'}
                                </span>
                                <div>
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <h3 className={`font-bold text-sm sm:text-base ${
                                            sequenceInfo.hasJumps ? 'text-amber-900' : sequenceInfo.numericCount > 0 ? 'text-emerald-900' : 'text-gray-700'
                                        }`}>
                                            {sequenceInfo.numericCount === 0 
                                                ? 'Kiểm tra Số Thứ Tự (STT) Toa Thuốc' 
                                                : sequenceInfo.hasJumps 
                                                    ? `Phát hiện nhảy STT: thiếu ${sequenceInfo.missingNumbers.length} số toa!` 
                                                    : 'Số thứ tự toa thuốc hoàn toàn liên tục!'}
                                        </h3>

        function PatientDetailsModal({ price, patients, fullPatientDetails, onSave, onClose, readOnly, selectedBranch, selectedDate, onOpenPriceModal }) {
            const [localPatients, setLocalPatients] = useState((patients || []).map(p => ({
                name: p.name || '',
                prescriptionNo: p.prescriptionNo || '',
                paymentMethod: p.paymentMethod === 'transfer' ? 'transfer' : 'cash'
            })));
            const [showInnerSeqModal, setShowInnerSeqModal] = useState(false);

            // Merge current editing list with other price levels for real-time validation and hints
            const currentMergedDetails = useMemo(() => {
                return {
                    ...(fullPatientDetails || {}),
                    [price]: localPatients
                };
            }, [fullPatientDetails, price, localPatients]);

            const innerSequenceInfo = useMemo(() => {
                return getSequenceAnalysis(currentMergedDetails, true);
            }, [currentMergedDetails]);

            const addPatient = () => {
                setLocalPatients([...localPatients, { name: '', prescriptionNo: '', paymentMethod: 'cash' }]);
            };

            const removePatient = (index) => {
                setLocalPatients(localPatients.filter((_, i) => i !== index));
            };

            const updatePatient = (index, field, value) => {
                const updated = [...localPatients];
                updated[index] = { ...updated[index], [field]: value };
                setLocalPatients(updated);
            };

            const getDuplicateInfo = (stt, currentIndex) => {
                if (!stt || !stt.trim()) return null;
                const trimmedSTT = stt.trim().toLowerCase();
                
                // Check in localPatients (same price)
                for (let i = 0; i < localPatients.length; i++) {
                    if (i !== currentIndex && localPatients[i].prescriptionNo && localPatients[i].prescriptionNo.trim().toLowerCase() === trimmedSTT) {
                        return price; // Duplicated in current price
                    }
                }

                // Check in other prices
                for (const [otherPrice, otherPatients] of Object.entries(fullPatientDetails || {})) {
                    if (otherPrice !== price.toString()) {
                        if (Array.isArray(otherPatients)) {
                            for (const op of otherPatients) {
                                if (op.prescriptionNo && op.prescriptionNo.trim().toLowerCase() === trimmedSTT) {
                                    return otherPrice;
                                }
                            }
                        }
                    }
                }
                
                return null;
            };

            const transferCount = localPatients.filter(p => p.paymentMethod === 'transfer').length;
            const cashCount = localPatients.length - transferCount;

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-3 sm:p-4">

                            </div>
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setShowInnerSeqModal(true)}

                                        innerSequenceInfo.hasJumps
                                            ? 'bg-amber-100 text-amber-900 hover:bg-amber-200 border border-amber-300'
                                            : 'bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200'
                                    }`}
                                    title="Kiểm tra toàn bộ STT toa hôm nay"
                                >
                                    <span>{innerSequenceInfo.hasJumps ? '⚠️' : '🔍'}</span>
                                    <span>{innerSequenceInfo.hasJumps ? `Nhảy ${innerSequenceInfo.missingNumbers.length} số` : 'Kiểm tra STT'}</span>
                                </button>
                                <button onClick={onClose} className="text-gray-500 text-2xl hover:text-gray-700 leading-none">&times;</button>
                            </div>
                        </div>

                        {/* Banner warning if jumped numbers exist */}
                        {innerSequenceInfo.hasJumps && (
                            <div 
                                onClick={() => setShowInnerSeqModal(true)}
                                className="mb-3 p-2 bg-amber-50 border border-amber-200 rounded-lg flex items-center justify-between text-xs text-amber-900 cursor-pointer hover:bg-amber-100 transition shadow-sm"
                                title="Nhấn để xem chi tiết các số toa bị nhảy"
                            >
                                <span className="font-semibold truncate">
                                    ⚠️ Có STT bị nhảy: thiếu {innerSequenceInfo.missingNumbers.slice(0, 4).map(n => `#${n}`).join(', ')}{innerSequenceInfo.missingNumbers.length > 4 ? '...' : ''}
                                </span>
                                <span className="underline font-bold ml-1 whitespace-nowrap">Xem &rarr;</span>
                            </div>
                        )}

                        {/* Payment count summary badge */}
                        {localPatients.length > 0 && (
                            <div className="flex items-center justify-between text-xs px-3 py-1.5 bg-gray-100 rounded-lg mb-2 border border-gray-200">
                                <span className="text-gray-600 font-medium">Tổng: <strong className="text-gray-900">{localPatients.length}</strong> toa</span>
                                <div className="flex items-center gap-2">
                                    <span className="text-gray-700 font-semibold">💵 TM: {cashCount}</span>
                                    <span className="text-gray-300">•</span>
                                    <span className="text-purple-700 font-bold">💳 CK: {transferCount}</span>
                                </div>
                            </div>
                        )}

                        <div className="overflow-y-auto flex-1 mb-4 space-y-2.5 pr-1">
                            {localPatients.length === 0 && (
                                <p className="text-gray-500 text-center italic py-4">Chưa có thông tin bé nào.</p>
                            )}
                            {localPatients.map((p, i) => {
                                const duplicatePrice = getDuplicateInfo(p.prescriptionNo, i);
                                const isTransfer = p.paymentMethod === 'transfer';
                                return (
                                    <div key={i} className="flex flex-col gap-1">
                                        <div className={`flex gap-2 items-center bg-gray-50 p-2 rounded-lg border transition ${
                                            duplicatePrice ? 'border-red-400 bg-red-50/40' : isTransfer ? 'border-purple-300 bg-purple-50/30' : 'border-gray-200'
                                        }`}>
                                            <input 
                                                type="text"
                                                placeholder="Tên bé"
                                                value={p.name || ''}
                                                onChange={e => updatePatient(i, 'name', e.target.value)}
                                                disabled={readOnly}
                                                className="flex-1 min-w-0 px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white"
                                            />
                                            <input 
                                                type="text"
                                                placeholder="STT Toa"
                                                value={p.prescriptionNo || ''}
                                                onChange={e => updatePatient(i, 'prescriptionNo', e.target.value)}
                                                disabled={readOnly}
                                                className="w-20 px-2 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 text-center bg-white font-medium"
                                            />
                                            <label 
                                                className={`flex items-center gap-1.5 px-2.5 py-2 rounded border text-xs font-bold select-none cursor-pointer transition ${
                                                    isTransfer 
                                                        ? 'bg-purple-600 text-white border-purple-600 shadow-sm' 
                                                        : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-100 hover:border-gray-400'
                                                }`}
                                                title={isTransfer ? 'Đang chọn: Chuyển khoản (Click để chuyển sang Tiền mặt)' : 'Mặc định: Tiền mặt (Click nếu khách Chuyển khoản)'}
                                            >
                                                <input 
                                                    type="checkbox"
                                                    checked={isTransfer}
                                                    onChange={e => {
                                                        if (!readOnly) {
                                                            updatePatient(i, 'paymentMethod', e.target.checked ? 'transfer' : 'cash');
                                                        }
                                                    }}
                                                    disabled={readOnly}
                                                    className="w-3.5 h-3.5 rounded text-purple-600 focus:ring-purple-500 cursor-pointer"
                                                />
                                                <span className="whitespace-nowrap">
                                                    {isTransfer ? '💳 CK' : 'CK'}
                                                </span>
                                            </label>
                                            {!readOnly && (
                                                <button 
                                                    onClick={() => removePatient(i)} 
                                                    className="text-red-400 hover:text-red-600 hover:bg-red-50 rounded p-1 font-bold text-base transition"
                                                    title="Xóa toa này"
                                                >
                                                    ✕
                                                </button>
                                            )}
                                        </div>
                                        {duplicatePrice !== null && (
                                            <p className="text-xs text-red-600 font-semibold px-2">
                                                ⚠️ Trùng STT toa ở mức giá {duplicatePrice}k
                                            </p>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                        {!readOnly && (
                            <div className="flex gap-3">
                                <button onClick={addPatient} className="flex-1 bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition">
                                    ➕ Thêm bé
                                </button>
                                <button 
                                    onClick={() => {
                                        const hasDuplicate = localPatients.some((p, i) => getDuplicateInfo(p.prescriptionNo, i) !== null);
                                        if (!hasDuplicate) {
                                            onSave(localPatients.map(p => ({
                                                name: (p.name || '').trim(),
                                                prescriptionNo: (p.prescriptionNo || '').trim(),
                                                paymentMethod: p.paymentMethod === 'transfer' ? 'transfer' : 'cash'
                                            })));
                                        }
                                    }} 
                                    disabled={localPatients.some((p, i) => getDuplicateInfo(p.prescriptionNo, i) !== null)}
                                    className={`flex-1 py-3 rounded-lg font-semibold transition shadow ${localPatients.some((p, i) => getDuplicateInfo(p.prescriptionNo, i) !== null) ? 'bg-gray-400 text-gray-200 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`}
                                >
                                    💾 Lưu
                                </button>
                            </div>
                        )}
                        {readOnly && (
                            <button onClick={onClose} className="w-full bg-gray-500 text-white py-3 rounded-lg font-semibold hover:bg-gray-600 transition shadow">
                                Đóng
                            </button>
                        )}
                    </div>

                    {/* Modal sequence inspector within patient modal */}
                    {showInnerSeqModal && (
                        <PrescriptionSequenceModal 
                            patientDetails={currentMergedDetails}
                            selectedBranch={selectedBranch}
                            selectedDate={selectedDate}
                            onClose={() => setShowInnerSeqModal(false)}
                            onOpenPriceModal={(targetPrice) => {
                                setShowInnerSeqModal(false);
                                if (targetPrice.toString() !== price.toString()) {
                                    onClose();
                                    onOpenPriceModal && onOpenPriceModal(targetPrice);
                                }
                            }}
                            readOnly={readOnly}
                        />
                    )}
                </div>
            );
        }

        // Doctor Fees Component
        function DoctorFeesSection({ doctorFees, onChange, readOnly = false }) {
            const addDoctorFee = () => {
                onChange([...doctorFees, { doctor: '', amount: '' }]);
            };

            const removeDoctorFee = (index) => {
                onChange(doctorFees.filter((_, i) => i !== index));
            };

            const updateDoctorFee = (index, field, value) => {
                const updated = [...doctorFees];
                updated[index][field] = value;

            return (

                        {!readOnly && (
                            <button
                                onClick={addDoctorFee}

                            <div key={index} className="flex gap-3 items-center bg-gray-50 p-3 rounded-lg">

                                    type="text"
                                    value={fee.doctor}
                                    onChange={(e) => updateDoctorFee(index, 'doctor', e.target.value)}

                                    disabled={readOnly}
                                    className={`flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 ${readOnly ? 'bg-gray-100 cursor-not-allowed' : ''}`}
                                />
                                <input
                                    type="number"
                                    value={fee.amount}
                                    onChange={(e) => updateDoctorFee(index, 'amount', e.target.value)}
                                    placeholder="500"
                                    disabled={readOnly}
                                    className={`w-32 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 ${readOnly ? 'bg-gray-100 cursor-not-allowed' : ''}`}
                                />
                                <span className="text-gray-600 font-semibold">k</span>
                                {!readOnly && (
                                    <button
                                        onClick={() => removeDoctorFee(index)}
                                        className="bg-red-500 text-white px-3 py-2 rounded-lg hover:bg-red-600 transition font-bold"
                                    >
                                        ✕
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );

                    </div>

                        {expenses.map((expense, index) => (

                                    type="text"
                                    value={expense.description}
                                    onChange={(e) => updateExpense(index, 'description', e.target.value)}

        // Medicine Section Component
        function MedicineSection({ medicines, medicineList, onChange, readOnly = false }) {
            const [showSuggestions, setShowSuggestions] = useState({});
            const [showMedicineSelect, setShowMedicineSelect] = useState(false);

            const addMedicine = () => {
                onChange([...medicines, { name: '', quantity: '', price: '' }]);
            };

            const addFromList = (medicine) => {
                const existing = medicines.find(m => m.name.toLowerCase() === medicine.name.toLowerCase());
                if (existing) {
                    alert('Thuốc này đã có trong danh sách!');
                    return;
                }
                onChange([...medicines, { name: medicine.name, quantity: '', price: medicine.price }]);
                setShowMedicineSelect(false);
            };

            const removeMedicine = (index) => {
                onChange(medicines.filter((_, i) => i !== index));
            };

            const updateMedicine = (index, field, value) => {
                const updated = [...medicines];
                updated[index][field] = value;
                
                // Auto-fill price when selecting from suggestions
                if (field === 'name') {
                    const matchedMedicine = medicineList.find(m => m.name.toLowerCase() === value.toLowerCase());
                    if (matchedMedicine && !updated[index].price) {
                        updated[index].price = matchedMedicine.price;
                    }
                }
                
                onChange(updated);
            };

            const selectMedicine = (index, medicine) => {
                const updated = [...medicines];
                updated[index].name = medicine.name;
                updated[index].price = medicine.price;
                onChange(updated);
                setShowSuggestions({ ...showSuggestions, [index]: false });
            };

            const getSuggestions = (index, searchTerm) => {
                if (!searchTerm || searchTerm.length < 2) return [];
                return medicineList.filter(med => 
                    med.name.toLowerCase().includes(searchTerm.toLowerCase())
                ).slice(0, 10);
            };

            const totalMedicine = medicines.reduce((sum, med) => {
                return sum + (parseFloat(med.quantity || 0) * parseFloat(med.price || 0));
            }, 0);

            return (
                <div className="bg-white rounded-lg shadow-md p-6">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-bold text-gray-800">💊 Tiền thuốc</h2>
                        {!readOnly && (
                            <div className="flex gap-2">
                                <button
                                    onClick={() => setShowMedicineSelect(!showMedicineSelect)}
                                    className="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition font-semibold"
                                >
                                    📚 Chọn từ danh sách
                                </button>
                                <button
                                    onClick={addMedicine}
                                    className="bg-teal-500 text-white px-4 py-2 rounded-lg hover:bg-teal-600 transition font-semibold"
                                >
                                    ➕ Thêm thuốc
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Medicine Select Popup */}
                    {showMedicineSelect && !readOnly && (
                        <div className="mb-4 bg-green-50 border-2 border-green-300 rounded-lg p-4">
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="font-bold text-gray-800">Chọn thuốc từ danh sách:</h3>
                                <button
                                    onClick={() => setShowMedicineSelect(false)}
                                    className="text-red-500 hover:text-red-700 font-bold text-xl"
                                >
                                    ✕
                                </button>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 max-h-60 overflow-y-auto">
                                {medicineList.map((med, i) => (
                                    <button
                                        key={i}
                                        onClick={() => addFromList(med)}
                                        className="text-left px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-green-100 hover:border-green-500 transition text-sm"
                                    >
                                        <div className="font-semibold capitalize">{med.name}</div>
                                        <div className="text-xs text-green-600 font-bold">{med.price}k</div>
                                    </button>
                                ))}
                            </div>
                        </div>
